plugins {
    id 'com.android.application'
}

// Release signing: read secrets from android/keystore.properties (gitignored).
// If absent (e.g. fresh clone without the release keystore), release builds fall back
// to the debug signing config so forks can still build; the official release_forge.sh
// requires the real keystore.
def keystorePropsFile = rootProject.file("keystore.properties")
def releaseSigning = null
if (keystorePropsFile.exists()) {
    def props = new Properties()
    keystorePropsFile.withInputStream { props.load(it) }
    releaseSigning = [
        storeFile: file(props["storeFile"]),
        storePassword: props["storePassword"],
        keyAlias: props["keyAlias"],
        keyPassword: props["keyPassword"],
    ]
}

android {
    namespace 'com.forge.live'
    compileSdk 35

    defaultConfig {
        applicationId "com.forge.live"
        minSdk 22
        targetSdk 35
        versionCode 92
        versionName "2.6.62"
    }

    // Two distribution flavors sharing one source tree:
    //   full = F-Droid / website build, all permissions (main manifest)
    //   play = Google Play build, restricted perms stripped (src/play/AndroidManifest.xml)
    flavorDimensions = ["distribution"]
    productFlavors {
        full {
            dimension "distribution"
        }
        play {
            dimension "distribution"
        }
    }

    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig (releaseSigning != null ? signingConfigs.release : signingConfigs.debug)
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-app')
    implementation project(':capacitor-filesystem')
    implementation project(':capacitor-keyboard')
    implementation project(':capacitor-preferences')
    implementation project(':capacitor-share')
    implementation project(':capacitor-status-bar')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.json:json:20231013'

    // CameraX in-process capture (replaces flaky OEM IMAGE_CAPTURE)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
