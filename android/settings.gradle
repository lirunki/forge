pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "Forge"
include ':app'

def capNode = new File(settingsDir, '../node_modules/@capacitor')

include ':capacitor-android'
project(':capacitor-android').projectDir = new File(capNode, 'android/capacitor')

include ':capacitor-app'
project(':capacitor-app').projectDir = new File(capNode, 'app/android')

include ':capacitor-filesystem'
project(':capacitor-filesystem').projectDir = new File(capNode, 'filesystem/android')

include ':capacitor-keyboard'
project(':capacitor-keyboard').projectDir = new File(capNode, 'keyboard/android')

include ':capacitor-preferences'
project(':capacitor-preferences').projectDir = new File(capNode, 'preferences/android')

include ':capacitor-share'
project(':capacitor-share').projectDir = new File(capNode, 'share/android')

include ':capacitor-status-bar'
project(':capacitor-status-bar').projectDir = new File(capNode, 'status-bar/android')
