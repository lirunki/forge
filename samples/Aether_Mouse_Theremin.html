<!DOCTYPE html>
<!-- carCompatible: true -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Aether — Theremin</title>
<style>:root{
  --bg:#0a0a12;
  --bg2:#12121f;
  --panel:#15151f;
  --ink:#e8e8f5;
  --dim:#7a7a96;
  --accent:#5eead4;
  --accent2:#a78bfa;
  --warn:#f472b6;
  --line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  overscroll-behavior:none;touch-action:none;}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;}

.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 8px;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{font-size:30px;color:var(--accent);text-shadow:0 0 18px var(--accent);
  line-height:1;animation:glow 3s ease-in-out infinite;}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.brand-text h1{font-size:18px;letter-spacing:4px;margin:0;font-weight:700;}
.brand-text p{font-size:10px;letter-spacing:3px;margin:2px 0 0;color:var(--dim);text-transform:uppercase;}

.mute{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:20px;display:grid;place-items:center;
  cursor:pointer;transition:.2s;}
.mute.muted{border-color:var(--warn);color:var(--warn);background:rgba(244,114,182,.12);}
.mute:active{transform:scale(.92);}

.readout{display:flex;gap:8px;padding:6px 18px 10px;}
.readout-row{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.rlbl{font-size:9px;letter-spacing:2px;color:var(--dim);}
.rval{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;
  font-family:"SF Mono",ui-monospace,monospace;}

.stage{position:relative;flex:1;margin:0 18px;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,#1a1a2e 0%,#0d0d18 70%);
  border:1px solid var(--line);min-height:220px;}
#guide{position:absolute;inset:0;width:100%;height:100%;display:block;}
.cursor{position:absolute;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--accent);box-shadow:0 0 16px var(--accent),inset 0 0 8px var(--accent);
  pointer-events:none;transform:translate(-50%,-50%);left:50%;top:50%;
  transition:opacity .15s;opacity:0;background:rgba(94,234,212,.12);}
.cursor.active{opacity:1;}
.cursor::after{content:"";position:absolute;inset:-10px;border-radius:50%;
  border:1px solid rgba(94,234,212,.3);animation:ring 1.4s ease-out infinite;}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.6);opacity:0}}

.hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;color:var(--dim);pointer-events:none;text-align:center;
  transition:opacity .3s;}
.hint.hide{opacity:0;}
.hint-icon{font-size:34px;animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hint span:nth-child(2){font-size:14px;letter-spacing:.5px;}
.hint-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}

.controls{padding:14px 18px 6px;display:flex;flex-direction:column;gap:12px;}
.ctrl-group{display:flex;flex-direction:column;gap:6px;}
.ctrl-label{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;}
.ctrl-val{color:var(--accent);font-family:"SF Mono",ui-monospace,monospace;}

.wave-row{display:flex;gap:8px;}
.wave{flex:1;height:46px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);color:var(--dim);font-size:22px;cursor:pointer;
  display:grid;place-items:center;transition:.18s;}
.wave.active{color:var(--accent);border-color:var(--accent);
  background:rgba(94,234,212,.1);box-shadow:0 0 14px rgba(94,234,212,.25);}
.wave:active{transform:scale(.95);}

.slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;
  background:var(--panel);border:1px solid var(--line);outline:none;cursor:pointer;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 10px var(--accent);cursor:pointer;border:none;}
.slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px var(--accent);cursor:pointer;border:none;}

.foot{padding:8px 18px 16px;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.5px;}
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">∿</span>
        <div class="brand-text">
          <h1>AETHER</h1>
          <p>mouse theremin</p>
        </div>
      </div>
      <button id="muteBtn" class="mute" aria-label="Mute toggle">
        <span class="mute-icon">🔊</span>
      </button>
    </header>

    <div class="readout">
      <div class="readout-row">
        <span class="rlbl">NOTE</span>
        <span id="noteName" class="rval">—</span>
      </div>
      <div class="readout-row">
        <span class="rlbl">FREQ</span>
        <span id="freqVal" class="rval">—</span>
      </div>
      <div class="readout-row">
        <span class="rlbl">VOL</span>
        <span id="volVal" class="rval">—</span>
      </div>
    </div>

    <div id="stage" class="stage">
      <canvas id="guide"></canvas>
      <div id="cursor" class="cursor"></div>
      <div id="hint" class="hint">
        <span class="hint-icon">✋</span>
        <span>Move your mouse here to play</span>
        <span class="hint-sub">X = pitch · Y = volume</span>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <span class="ctrl-label">WAVEFORM</span>
        <div class="wave-row" id="waveRow">
          <button class="wave active" data-wave="sine">∿</button>
          <button class="wave" data-wave="triangle">△</button>
          <button class="wave" data-wave="square">⊓</button>
          <button class="wave" data-wave="sawtooth">⩘</button>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">REVERB <span id="revVal" class="ctrl-val">30%</span></span>
        <input id="reverbSlider" class="slider" type="range" min="0" max="100" value="30" />
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">PITCH RANGE <span id="rangeVal" class="ctrl-val">4 oct</span></span>
        <input id="rangeSlider" class="slider" type="range" min="2" max="6" step="1" value="4" />
      </div>
    </div>

    <footer class="foot">
      <span>Click &amp; hold stage to sustain · release to stop</span>
    </footer>
  </div>

  <script >
/* Aether Theremin — audio engine
   Oscillator -> gentle lowpass -> reverb (convolver generated impulse) -> master gain
   Mouse X = pitch (exponential), Y = volume (linear). */
(function () {
  "use strict";

  class Theremin {
    constructor() {
      this.ctx = null;
      this.ready = false;
      this.muted = false;
      this.wave = "sine";
      this.reverbAmt = 0.3;
      this.octaves = 4;
      this.baseFreq = 110; // A2
      this.playing = false;
      this._curFreq = 220;
      this._curVol = 0;
      this.onParam = null;
    }

    async init() {
      if (this.ready) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctx();
      await this.ctx.resume();

      // signal chain
      this.osc = this.ctx.createOscillator();
      this.osc.type = this.wave;
      this.osc.frequency.value = 220;

      // gentle lowpass to soften harsher waves, tracks pitch
      this.filter = this.ctx.createBiquadFilter();
      this.filter.type = "lowpass";
      this.filter.frequency.value = 2600;
      this.filter.Q.value = 0.7;

      // dry/wet
      this.dry = this.ctx.createGain();
      this.wet = this.ctx.createGain();
      this.dry.gain.value = 1 - this.reverbAmt;
      this.wet.gain.value = this.reverbAmt;

      // reverb convolver
      this.reverb = this.ctx.createConvolver();
      this.reverb.buffer = this._impulse(2.6, 2.2);

      // master (volume controlled by Y)
      this.master = this.ctx.createGain();
      this.master.gain.value = 0;

      // final limiter-ish
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -8;
      this.comp.knee.value = 12;
      this.comp.ratio.value = 4;
      this.comp.attack.value = 0.003;
      this.comp.release.value = 0.18;

      // connect: osc -> filter -> [dry -> master] + [wet -> reverb -> master] -> comp -> out
      this.osc.connect(this.filter);
      this.filter.connect(this.dry);
      this.filter.connect(this.wet);
      this.dry.connect(this.master);
      this.wet.connect(this.reverb);
      this.reverb.connect(this.master);
      this.master.connect(this.comp);
      this.comp.connect(this.ctx.destination);

      this.osc.start();
      this.ready = true;
    }

    _impulse(duration, decay) {
      const ctx = this.ctx;
      const rate = ctx.sampleRate;
      const len = Math.max(1, Math.floor(rate * duration));
      const buf = ctx.createBuffer(2, len, rate);
      for (let c = 0; c < 2; c++) {
        const ch = buf.getChannelData(c);
        for (let i = 0; i < len; i++) {
          const t = i / len;
          // smooth decaying noise with a little early reflection shape
          const env = Math.pow(1 - t, decay);
          ch[i] = (Math.random() * 2 - 1) * env;
        }
      }
      return buf;
    }

    setWave(type) {
      this.wave = type;
      if (this.osc) this.osc.type = type;
    }

    setReverb(amt) {
      this.reverbAmt = Math.max(0, Math.min(1, amt));
      if (this.ready) {
        const t = this.ctx.currentTime;
        this.dry.gain.setTargetAtTime(1 - this.reverbAmt * 0.85, t, 0.05);
        this.wet.gain.setTargetAtTime(this.reverbAmt, t, 0.05);
      }
    }

    setOctaves(n) { this.octaves = n; }

    setMuted(m) {
      this.muted = m;
      if (this.ready) {
        const t = this.ctx.currentTime;
        this.comp;
        // mute by ramping master target handled in update
      }
    }

    // nx in [0,1] left->right, ny in [0,1] top->bottom
    update(nx, ny, playing) {
      if (!this.ready) return;
      const t = this.ctx.currentTime;
      // pitch: exponential across octaves
      const minF = this.baseFreq;
      const maxF = this.baseFreq * Math.pow(2, this.octaves);
      const freq = minF * Math.pow(maxF / minF, Math.max(0, Math.min(1, nx)));
      this._curFreq = freq;

      // volume: top = loud, bottom = quiet. invert Y.
      let vol = 1 - Math.max(0, Math.min(1, ny));
      vol = Math.pow(vol, 1.6); // ease for expressiveness
      vol *= 0.32; // ceiling
      this._curVol = vol;

      const target = (playing && !this.muted) ? vol : 0;
      this.osc.frequency.setTargetAtTime(freq, t, 0.015);
      // smoother, more "theremin-like" glide
      this.master.gain.setTargetAtTime(target, t, playing ? 0.02 : 0.06);

      // filter follows pitch for warmth
      this.filter.frequency.setTargetAtTime(Math.min(8000, freq * 6 + 800), t, 0.05);

      if (this.onParam) this.onParam(freq, this._curVol, playing);
    }

    noteName(freq) {
      const n = Math.round(12 * Math.log2(freq / 440)) + 69; // MIDI
      const names = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
      const oct = Math.floor(n / 12) - 1;
      const name = names[((n % 12) + 12) % 12];
      const cents = Math.round(1200 * Math.log2(freq / 440) / (1/12) ) ;
      // cents off from nearest equal-tempered note
      const ideal = 440 * Math.pow(2, (n - 69) / 12);
      const off = Math.round(1200 * Math.log2(freq / ideal));
      return { name: name + oct, off };
    }
  }

  window.Theremin = Theremin;
})();

</script>
  <script >
/* Visual guide for the play area — animated grid + pitch lanes + echo ripples. */
(function () {
  "use strict";

  class Guide {
    constructor(canvas) {
      this.cv = canvas;
      this.ctx = canvas.getContext("2d");
      this.dpr = Math.min(2, window.devicePixelRatio || 1);
      this.w = 0; this.h = 0;
      this.ripples = [];
      this.active = false;
      this.nx = 0.5; this.ny = 0.5;
      this.octaves = 4;
      this._resize();
      window.addEventListener("resize", () => this._resize());
    }

    _resize() {
      const r = this.cv.getBoundingClientRect();
      this.w = r.width; this.h = r.height;
      this.cv.width = this.w * this.dpr;
      this.cv.height = this.h * this.dpr;
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    }

    setOctaves(n) { this.octaves = n; }

    pointer(nx, ny, active) {
      this.nx = nx; this.ny = ny; this.active = active;
      if (active) this.ripples.push({ x: nx * this.w, y: ny * this.h, r: 6, a: 0.5 });
    }

    draw() {
      const ctx = this.ctx, w = this.w, h = this.h;
      ctx.clearRect(0, 0, w, h);

      // vertical pitch lanes (one per octave)
      const lanes = this.octaves;
      for (let i = 1; i < lanes; i++) {
        const x = (i / lanes) * w;
        ctx.strokeStyle = "rgba(255,255,255,.05)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      // octave labels
      ctx.fillStyle = "rgba(122,122,150,.5)";
      ctx.font = "9px ui-monospace, monospace";
      ctx.textAlign = "center";
      for (let i = 0; i < lanes; i++) {
        const x = ((i + 0.5) / lanes) * w;
        ctx.fillText("oct " + i, x, 14);
      }

      // horizontal volume gradient lines
      for (let j = 1; j < 5; j++) {
        const y = (j / 5) * h;
        ctx.strokeStyle = "rgba(255,255,255," + (0.04 + (1 - j / 5) * 0.05) + ")";
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      // vol labels (top loud, bottom quiet)
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(94,234,212,.45)";
      ctx.fillText("LOUD", 6, 12);
      ctx.fillStyle = "rgba(122,122,150,.45)";
      ctx.fillText("soft", 6, h - 6);

      // center crosshair faint
      ctx.strokeStyle = "rgba(255,255,255,.06)";
      ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
      ctx.setLineDash([]);

      // ripples
      this.ripples = this.ripples.filter(r => r.a > 0.02);
      for (const r of this.ripples) {
        r.r += 1.6; r.a *= 0.94;
        ctx.strokeStyle = "rgba(94,234,212," + r.a + ")";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
      }

      // active beam from cursor to top (pitch indicator)
      if (this.active) {
        const cx = this.nx * w, cy = this.ny * h;
        const g = ctx.createLinearGradient(cx, 0, cx, h);
        g.addColorStop(0, "rgba(167,139,250,.25)");
        g.addColorStop(1, "rgba(94,234,212,.05)");
        ctx.fillStyle = g;
        ctx.fillRect(cx - 1, 0, 2, h);

        // glow halo at cursor
        const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
        rg.addColorStop(0, "rgba(94,234,212,.25)");
        rg.addColorStop(1, "rgba(94,234,212,0)");
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI * 2); ctx.fill();
      }
    }

    loop() {
      this.draw();
      requestAnimationFrame(() => this.loop());
    }
  }

  window.Guide = Guide;
})();

</script>
  <script >
/* Aether Theremin — main controller */
(function () {
  "use strict";

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("guide");
  const cursor = document.getElementById("cursor");
  const hint = document.getElementById("hint");
  const muteBtn = document.getElementById("muteBtn");
  const muteIcon = muteBtn.querySelector(".mute-icon");

  const noteEl = document.getElementById("noteName");
  const freqEl = document.getElementById("freqVal");
  const volEl = document.getElementById("volVal");
  const revSlider = document.getElementById("reverbSlider");
  const revVal = document.getElementById("revVal");
  const rangeSlider = document.getElementById("rangeSlider");
  const rangeVal = document.getElementById("rangeVal");
  const waveRow = document.getElementById("waveRow");

  const theremin = new window.Theremin();
  const guide = new window.Guide(canvas);
  guide.loop();

  let playing = false;
  let nx = 0.5, ny = 0.5;

  // ---- pointer handling ----
  function pos(e) {
    const r = stage.getBoundingClientRect();
    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    const x = Math.max(0, Math.min(r.width, p.clientX - r.left));
    const y = Math.max(0, Math.min(r.height, p.clientY - r.top));
    return { x, y, w: r.width, h: r.height };
  }

  async function start() {
    await theremin.init();
    playing = true;
    hint.classList.add("hide");
    cursor.classList.add("active");
  }
  function stop() {
    playing = false;
    theremin.update(nx, ny, false);
    cursor.classList.remove("active");
  }

  function move(e) {
    const p = pos(e);
    nx = p.x / p.w;
    ny = p.y / p.h;
    cursor.style.left = (nx * 100) + "%";
    cursor.style.top = (ny * 100) + "%";
    guide.pointer(nx, ny, playing);
    if (theremin.ready) theremin.update(nx, ny, playing);
  }

  // mouse: hold to sustain
  stage.addEventListener("mousedown", (e) => { e.preventDefault(); start(); move(e); });
  stage.addEventListener("mousemove", move);
  window.addEventListener("mouseup", stop);
  // touch: drag to play
  stage.addEventListener("touchstart", (e) => { e.preventDefault(); start(); move(e); }, { passive: false });
  stage.addEventListener("touchmove", (e) => { e.preventDefault(); move(e); }, { passive: false });
  stage.addEventListener("touchend", (e) => { e.preventDefault(); stop(); }, { passive: false });

  // also allow mouse-enter without click to preview (hover mode) — optional, gentle
  stage.addEventListener("mouseenter", (e) => { if (!playing) { /* hover preview off by default */ } });

  // ---- readout ----
  theremin.onParam = (freq, vol, isPlaying) => {
    if (isPlaying) {
      const n = theremin.noteName(freq);
      noteEl.textContent = n.name;
      const offTxt = n.off === 0 ? "" : (n.off > 0 ? "+" : "") + n.off + "¢";
      freqEl.textContent = (freq >= 1000 ? (freq / 1000).toFixed(2) + "k" : freq.toFixed(1)) + "Hz" + (offTxt ? " " + offTxt : "");
      volEl.textContent = Math.round(vol / 0.32 * 100) + "%";
    } else {
      noteEl.textContent = "—";
      freqEl.textContent = "—";
      volEl.textContent = "—";
    }
  };

  // ---- controls ----
  waveRow.addEventListener("click", (e) => {
    const b = e.target.closest(".wave");
    if (!b) return;
    waveRow.querySelectorAll(".wave").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    theremin.setWave(b.dataset.wave);
  });

  revSlider.addEventListener("input", () => {
    const v = parseInt(revSlider.value, 10);
    revVal.textContent = v + "%";
    theremin.setReverb(v / 100);
  });

  rangeSlider.addEventListener("input", () => {
    const v = parseInt(rangeSlider.value, 10);
    rangeVal.textContent = v + " oct";
    theremin.setOctaves(v);
    guide.setOctaves(v);
  });

  let muted = false;
  muteBtn.addEventListener("click", async () => {
    muted = !muted;
    theremin.setMuted(muted);
    muteBtn.classList.toggle("muted", muted);
    muteIcon.textContent = muted ? "🔇" : "🔊";
    if (theremin.ready) theremin.update(nx, ny, playing);
    try { window.ForgeHost && await window.ForgeHost.toast(muted ? "Muted" : "Unmuted"); } catch (_) {}
  });

  // ---- lifecycle ----
  try {
    const F = window.ForgeHost;
    if (F && F.on) {
      F.on("resume", () => { if (theremin.ctx && theremin.ctx.state === "suspended") theremin.ctx.resume(); });
      F.on("pause", () => { if (theremin.ctx && theremin.ctx.state === "running") theremin.ctx.suspend(); });
    }
  } catch (_) {}
})();

</script>
</body>
</html>
