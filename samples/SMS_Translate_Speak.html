<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SMS Translate</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:system-ui} .sms-card{transition:all .2s} .sms-card:active{transform:scale(0.98)}</style></head><body class="bg-zinc-950 text-zinc-200"><div class="max-w-md mx-auto min-h-screen flex flex-col"><div class="px-4 py-3 bg-zinc-900 flex items-center justify-between sticky top-0 z-10"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-emerald-500 rounded-xl flex items-center justify-center"><span class="text-white text-xl">📱</span></div><div><div class="font-semibold">SMS Translate</div><div class="text-xs text-zinc-500">xAI + TTS</div></div></div><div onclick="showTab('settings')" class="px-3 py-1.5 bg-zinc-800 rounded-2xl text-sm flex items-center gap-1 cursor-pointer"><span>⚙️</span><span class="text-xs">AI</span></div></div><div class="flex-1 p-4"><div id="inbox-tab"><div class="flex justify-between items-center mb-3"><div class="font-semibold">Inbox</div><button onclick="loadSMS()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-2xl text-sm font-medium flex items-center gap-2"><span>🔄</span><span>Load SMS</span></button></div><div id="sms-list" class="space-y-2"></div></div><div id="translate-tab" class="hidden"><div class="mb-4"><div class="text-sm text-zinc-400 mb-1">Original</div><div id="original-text" class="p-4 bg-zinc-900 rounded-3xl text-sm"></div></div><div class="mb-4"><div class="flex justify-between"><div class="text-sm text-zinc-400 mb-1">Translated</div><select id="lang-select" class="bg-zinc-900 text-xs px-2 py-1 rounded-xl" onchange="saveLang()"><option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="zh">Chinese</option><option value="ja">Japanese</option><option value="hi">Hindi</option></select></div><div id="translated-text" class="p-4 bg-zinc-900 rounded-3xl text-sm min-h-[80px]"></div></div><div class="flex gap-3"><button onclick="translateMessage()" class="flex-1 py-3 bg-blue-600 rounded-3xl font-medium">Translate</button><button onclick="speakTranslation()" class="flex-1 py-3 bg-violet-600 rounded-3xl font-medium">🔊 Speak</button></div></div><div id="settings-tab" class="hidden"><div class="space-y-4"><div><div class="text-sm mb-1.5">xAI API Key</div><input id="api-key" type="password" class="w-full bg-zinc-900 px-4 py-3 rounded-3xl text-sm" placeholder="sk-..."><button onclick="saveApiKey()" class="mt-2 w-full py-2.5 bg-zinc-800 rounded-3xl text-sm">Save Key</button></div><div><div class="text-sm mb-1.5">Model</div><div class="flex gap-2 mb-2"><button onclick="fetchModels()" class="flex-1 py-2 bg-zinc-800 rounded-2xl text-sm">Fetch from xAI</button></div><select id="model-select" class="w-full bg-zinc-900 px-4 py-3 rounded-3xl text-sm" onchange="handleModelChange()"><option value="grok-beta">grok-beta</option><option value="grok-2">grok-2</option></select><input id="custom-model" type="text" class="hidden mt-2 w-full bg-zinc-900 px-4 py-3 rounded-3xl text-sm" placeholder="Enter custom model name"><button onclick="saveModel()" class="mt-2 w-full py-2.5 bg-zinc-800 rounded-3xl text-sm">Save Model</button></div><div><div class="text-sm mb-1.5">TTS Voice</div><button onclick="loadVoices()" class="w-full py-2 bg-zinc-800 rounded-2xl text-sm mb-2">Load Voices</button><select id="voice-select" class="w-full bg-zinc-900 px-4 py-3 rounded-3xl text-sm"></select><button onclick="saveVoice()" class="mt-2 w-full py-2.5 bg-zinc-800 rounded-3xl text-sm">Save Voice</button></div><div class="text-xs text-zinc-500">Key, model and voice stored locally.</div></div></div></div><div class="h-14"></div></div><div class="fixed bottom-0 max-w-md w-full bg-zinc-900 border-t border-zinc-800 px-4 py-2 flex"><div onclick="showTab('inbox')" class="flex-1 text-center py-2 text-xs cursor-pointer">📥 Inbox</div><div onclick="showTab('translate')" class="flex-1 text-center py-2 text-xs cursor-pointer">🌐 Translate</div></div></div><script>let currentSMS = null; async function loadSMS() { try { const perm = await ForgeHost.permissions.request('sms'); if (!perm) { ForgeHost.toast('SMS permission denied'); return; } const res = await ForgeHost.sms.read({limit: 30, box: 'inbox'}); const list = document.getElementById('sms-list'); list.innerHTML = ''; if (!res.messages || res.messages.length === 0) { list.innerHTML = '<div class="text-center py-8 text-zinc-500">No SMS found</div>'; return; } res.messages.forEach(msg => { const div = document.createElement('div'); div.className = 'sms-card p-4 bg-zinc-900 rounded-3xl cursor-pointer'; div.innerHTML = `<div class="text-xs text-emerald-400">${msg.address || 'Unknown'}</div><div class="line-clamp-2 text-sm mt-1">${msg.body}</div>`; div.onclick = () => selectSMS(msg); list.appendChild(div); }); } catch(e) { ForgeHost.toast('Error loading SMS'); } } function selectSMS(msg) { currentSMS = msg; document.getElementById('original-text').innerText = msg.body; document.getElementById('translated-text').innerText = ''; showTab('translate'); } async function translateMessage() { if (!currentSMS) return; const key = await ForgeHost.storage.get('xai_key'); let model = await ForgeHost.storage.get('xai_model') || 'grok-beta'; if (model === 'custom') model = await ForgeHost.storage.get('xai_custom_model') || 'grok-beta'; if (!key) { ForgeHost.toast('Please add xAI API key in AI tab'); showTab('settings'); return; } const lang = document.getElementById('lang-select').value; const prompt = `Translate the following SMS message to ${lang}. Only return the translation: ${currentSMS.body}`; try { const resp = await ForgeHost.http.post('https://api.x.ai/v1/chat/completions', { model: model, messages: [{role:'user', content: prompt}], max_tokens: 300 }, { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' }); let data = resp; if (resp && resp.data) data = resp.data; if (data.error) { const errMsg = typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error)); throw new Error('API error: ' + errMsg); } if (!data.choices || !data.choices[0] || !data.choices[0].message || !data.choices[0].message.content) { throw new Error('Invalid API response structure: ' + JSON.stringify(data)); } const translation = data.choices[0].message.content.trim(); document.getElementById('translated-text').innerText = translation; } catch(e) { ForgeHost.toast('Translation failed: ' + (e.message || 'Check key or network')); } } async function speakTranslation() { const text = document.getElementById('translated-text').innerText; if (!text) { ForgeHost.toast('No translation to speak'); return; } try { const available = await ForgeHost.tts.isAvailable(); if (available) { const lang = document.getElementById('lang-select').value; const ttsLang = lang === 'en' ? 'en-US' : lang + '-' + lang.toUpperCase(); const voice = await ForgeHost.storage.get('tts_voice'); const opts = { lang: ttsLang, rate: 1, pitch: 1, wait: true }; if (voice) opts.voice = voice; await ForgeHost.tts.speak(text, opts); } else { ForgeHost.toast('TTS unavailable - copied to clipboard'); await ForgeHost.clipboard.write(text); } } catch(e) { ForgeHost.toast('TTS failed: ' + e.message); await ForgeHost.clipboard.write(text); } } function showTab(tab) { document.getElementById('inbox-tab').classList.add('hidden'); document.getElementById('translate-tab').classList.add('hidden'); document.getElementById('settings-tab').classList.add('hidden'); document.getElementById(tab + '-tab').classList.remove('hidden'); if (tab === 'settings') loadVoices(); } async function saveApiKey() { const key = document.getElementById('api-key').value.trim(); if (key) { await ForgeHost.storage.set('xai_key', key); ForgeHost.toast('API key saved'); } } async function fetchModels() { const key = document.getElementById('api-key').value.trim() || await ForgeHost.storage.get('xai_key'); if (!key) { ForgeHost.toast('Enter API key first'); return; } try { const resp = await ForgeHost.http.get('https://api.x.ai/v1/models', { 'Authorization': 'Bearer ' + key }); let data = resp; if (resp && resp.data) data = resp.data; const select = document.getElementById('model-select'); select.innerHTML = ''; if (data.data && Array.isArray(data.data)) { data.data.forEach(m => { const opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.id; select.appendChild(opt); }); } const customOpt = document.createElement('option'); customOpt.value = 'custom'; customOpt.textContent = 'Custom model...'; select.appendChild(customOpt); ForgeHost.toast('Models loaded'); } catch(e) { ForgeHost.toast('Failed to fetch models'); } } function handleModelChange() { const select = document.getElementById('model-select'); const customInput = document.getElementById('custom-model'); if (select.value === 'custom') { customInput.classList.remove('hidden'); } else { customInput.classList.add('hidden'); } } async function saveModel() { const select = document.getElementById('model-select'); const customInput = document.getElementById('custom-model'); let model = select.value; if (model === 'custom') { model = customInput.value.trim(); if (!model) { ForgeHost.toast('Enter custom model name'); return; } await ForgeHost.storage.set('xai_custom_model', model); await ForgeHost.storage.set('xai_model', 'custom'); } else { await ForgeHost.storage.set('xai_model', model); } ForgeHost.toast('Model saved'); } async function loadVoices() { const select = document.getElementById('voice-select'); select.innerHTML = ''; try { let voices = await ForgeHost.tts.getVoices(); if (!voices || voices.length === 0) voices = ['Default']; voices.forEach(v => { const opt = document.createElement('option'); let val = typeof v === 'string' ? v : (v.name || v.id || JSON.stringify(v)); opt.value = val; opt.textContent = val + (v.lang ? ' (' + v.lang + ')' : ''); select.appendChild(opt); }); ForgeHost.toast('Full voice catalog loaded'); } catch(e) { const opt = document.createElement('option'); opt.value = 'Default'; opt.textContent = 'Default'; select.appendChild(opt); ForgeHost.toast('Using default voice'); } } async function saveVoice() { const select = document.getElementById('voice-select'); if (select.value) { await ForgeHost.storage.set('tts_voice', select.value); ForgeHost.toast('Voice saved'); } } async function init() { const savedKey = await ForgeHost.storage.get('xai_key'); if (savedKey) document.getElementById('api-key').value = savedKey; const savedModel = await ForgeHost.storage.get('xai_model'); const savedCustom = await ForgeHost.storage.get('xai_custom_model'); const select = document.getElementById('model-select'); if (savedModel === 'custom' && savedCustom) { const opt = document.createElement('option'); opt.value = 'custom'; opt.textContent = 'Custom: ' + savedCustom; select.appendChild(opt); select.value = 'custom'; document.getElementById('custom-model').value = savedCustom; document.getElementById('custom-model').classList.remove('hidden'); } else if (savedModel) { select.value = savedModel; } const savedVoice = await ForgeHost.storage.get('tts_voice'); if (savedVoice) { const vSelect = document.getElementById('voice-select'); const opt = document.createElement('option'); opt.value = savedVoice; opt.textContent = savedVoice; vSelect.appendChild(opt); vSelect.value = savedVoice; } showTab('inbox'); } window.onload = init;</script></body></html>
