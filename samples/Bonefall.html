<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bonefall</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#f7f4ea;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;flex-direction:column}header{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:25px;letter-spacing:-.7px}header p{margin:3px 0 0;color:#9da7bf;font-size:12px}.badge{border:1px solid #313b59;border-radius:99px;color:#aeb8d4;padding:7px 10px;font-size:11px;font-weight:700;white-space:nowrap}.stage{position:relative;flex:1;min-height:0;margin:0 12px 12px;border:1px solid #26304b;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 15%,#1b2745 0,#10182d 45%,#0b1020 100%);box-shadow:0 16px 40px #0005}.stage:after{content:'';position:absolute;left:5%;right:5%;bottom:10%;height:1px;background:#7180a133;box-shadow:0 0 22px 5px #6877a11c}.tip{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-size:11px;color:#aeb8d4;background:#111a31cc;border:1px solid #34405e;border-radius:99px;padding:7px 12px;z-index:2;white-space:nowrap}.legend{position:absolute;right:15px;top:15px;color:#8793ae;font-size:10px;text-align:right;line-height:1.5}.controls{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:#11192dcc;backdrop-filter:blur(15px);border:1px solid #35415d;border-radius:18px;padding:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{border:0;background:#293653;color:#fff;border-radius:12px;min-width:44px;height:42px;font-size:17px;font-weight:800;cursor:pointer}.btn.primary{background:#e7b96e;color:#191307}.btn:active{transform:scale(.95)}.control{display:flex;align-items:center;gap:7px;flex:1;min-width:125px}.control label{font-size:10px;color:#9da7bf;white-space:nowrap}.control input{width:100%;accent-color:#e7b96e}.control b{font-size:11px;color:#dce2f1;min-width:40px;text-align:right}canvas{width:100%;height:100%;display:block;touch-action:none}@media(max-width:390px){.control{min-width:115px}.legend{display:none}}</style></head><body><header><div><h1>Bonefall</h1><p>Pull a joint. Gravity does the rest.</p></div><span class="badge">RIGID FRAME</span></header><main class="stage" id="stage"><canvas id="canvas"></canvas><div class="tip" id="tip">Drag any glowing joint</div><div class="legend">GOLD · rigid joints<br>BLUE · flexible joints<br>FAINT · hand / foot guides</div><section class="controls"><button class="btn primary" id="pause">Ⅱ</button><button class="btn" id="reset">↺</button><div class="control"><label>GRAVITY</label><input id="gravity" type="range" min="0" max="2" step=".05" value=".8"><b id="gravityRead">0.8×</b></div><div class="control"><label>ELASTICITY</label><input id="elastic" type="range" min=".15" max="1" step=".05" value=".65"><b id="elasticRead">65%</b></div><div class="control zoomControl"><label>ZOOM</label><input id="zoom" type="range" min=".1" max="10" step=".1" value="1"><b id="zoomRead">100%</b></div></section></main><script >
(()=>{const c=document.getElementById('canvas'),stage=document.getElementById('stage'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr,zoom=1,paused=false,drag=null,last=0,acc=0;const names=['head','back','hip','lArm','lForearm','lHand','rArm','rForearm','rHand','lLeg','lForeleg','lFoot','rLeg','rForeleg','rFoot'];let pts=[],links=[];const defs=[['head','back',.9],['back','hip',.95],['back','lArm',1,1],['lArm','lForearm',.8],['lForearm','lHand',.75],['back','rArm',1,1],['rArm','rForearm',.8],['rForearm','rHand',.75],['hip','lLeg',1,1],['lLeg','lForeleg',.9],['lForeleg','lFoot',.8],['hip','rLeg',1,1],['rLeg','rForeleg',.9],['rForeleg','rFoot',.8],['lHand','rHand',.2,0,'faint'],['lFoot','rFoot',.25,0,'faint']];function make(){let cx=W/2,top=Math.max(105,H*.2),s=Math.min(W/270,H/390),q={head:[cx,top],back:[cx,top+58*s],hip:[cx,top+130*s],lArm:[cx-35*s,top+67*s],lForearm:[cx-68*s,top+115*s],lHand:[cx-79*s,top+165*s],rArm:[cx+35*s,top+67*s],rForearm:[cx+68*s,top+115*s],rHand:[cx+79*s,top+165*s],lLeg:[cx-25*s,top+145*s],lForeleg:[cx-43*s,top+225*s],lFoot:[cx-57*s,top+292*s],rLeg:[cx+25*s,top+145*s],rForeleg:[cx+43*s,top+225*s],rFoot:[cx+57*s,top+292*s]};pts=names.map(n=>({name:n,x:q[n][0],y:q[n][1],ox:q[n][0],oy:q[n][1],vx:0,vy:0,r:n==='head'?20:9,drag:false}));links=defs.map(([a,b,k,rigid,style])=>({a:pts.find(p=>p.name===a),b:pts.find(p=>p.name===b),rest:Math.hypot(q[a][0]-q[b][0],q[a][1]-q[b][1]),k,rigid,style,rx:q[b][0]-q[a][0],ry:q[b][1]-q[a][1]}))}function resize(){dpr=devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);make()}function solve(){let g=+$('gravity').value,e=+$('elastic').value;pts.forEach(p=>{if(p.drag)return;p.vy+=.42*g;p.vx*=.995;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;if(p.y>H-48){p.y=H-48;p.vy*=-.35;p.vx*=.82}if(p.x<20){p.x=20;p.vx*=-.4}if(p.x>W-20){p.x=W-20;p.vx*=-.4}});for(let k=0;k<3;k++)links.forEach(l=>{if(l.rigid){if(l.b.drag){l.a.x=l.b.x-l.rx;l.a.y=l.b.y-l.ry}else{l.b.x=l.a.x+l.rx;l.b.y=l.a.y+l.ry;l.b.vx=l.a.vx;l.b.vy=l.a.vy}return}let dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.hypot(dx,dy)||1,f=(d-l.rest)/d*l.k*e*.72;if(!l.a.drag){l.a.x+=dx*f;l.a.y+=dy*f}if(!l.b.drag){l.b.x-=dx*f;l.b.y-=dy*f}});pts.forEach(p=>{if(!p.drag){p.vx+=(p.ox-p.x)*.004*(1-e);p.vy+=(p.oy-p.y)*.004*(1-e)}})}function draw(){x.clearRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.scale(zoom,zoom);x.translate(-W/2,-H/2);x.lineCap='round';links.forEach(l=>{if(l.style==='faint'){x.strokeStyle='#aebee90d';x.lineWidth=1; x.setLineDash([3,7])}else{x.setLineDash([]);x.strokeStyle=l.rigid?'#e7b96e99':'#7185b566';x.lineWidth=l.rigid?9:7}x.beginPath();x.moveTo(l.a.x,l.a.y);x.lineTo(l.b.x,l.b.y);x.stroke();x.setLineDash([])});pts.forEach(p=>{x.beginPath();x.fillStyle=p.drag?'#f5cf87':'#e9edf7';x.shadowColor=p.drag?'#f5cf87':'#aebee9';x.shadowBlur=p.drag?20:8;x.arc(p.x,p.y,p.r,0,7);x.fill();x.shadowBlur=0;x.strokeStyle='#7185b5';x.lineWidth=2;x.stroke()});x.restore()}function frame(t){if(!last)last=t;acc+=Math.min(32,t-last);last=t;if(!paused)while(acc>8){solve();acc-=8}draw();requestAnimationFrame(frame)}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left-W/2)/zoom+W/2,y:(e.clientY-r.top-H/2)/zoom+H/2}}c.onpointerdown=e=>{let m=pos(e),p=pts.find(p=>Math.hypot(p.x-m.x,p.y-m.y)<28/zoom);if(p){drag=p;p.drag=true;p.x=m.x;p.y=m.y;p.vx=p.vy=0;c.setPointerCapture(e.pointerId);$('tip').textContent='Release to let go'}};c.onpointermove=e=>{if(drag){let m=pos(e);drag.vx=(m.x-drag.x)*.8;drag.vy=(m.y-drag.y)*.8;drag.x=m.x;drag.y=m.y}};c.onpointerup=()=>{if(drag){drag.drag=false;drag=null}};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};$('reset').onclick=()=>make();$('gravity').oninput=e=>$('gravityRead').textContent=(+e.target.value).toFixed(1)+'×';$('elastic').oninput=e=>$('elasticRead').textContent=Math.round(+e.target.value*100)+'%';$('zoom').oninput=e=>{zoom=+e.target.value;$('zoomRead').textContent=zoom<1?zoom.toFixed(1)+'×':Math.round(zoom*100)+'%'};addEventListener('resize',resize);resize();requestAnimationFrame(frame)})();
</script></body></html>
