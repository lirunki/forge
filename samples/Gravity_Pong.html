<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Gravity Pong</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070710;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,470px);height:100%;padding:10px 12px;display:flex;flex-direction:column;gap:8px}header{text-align:center}h1{margin:0;font-size:25px;letter-spacing:2px;background:linear-gradient(90deg,#61efff,#ff68b9);-webkit-background-clip:text;color:transparent}.sub{font-size:11px;color:#85859a;margin-top:2px}.scores{display:flex;justify-content:space-between;align-items:center;padding:0 4px}.scorebox{text-align:center}.label{font-size:10px;font-weight:800;letter-spacing:1px;color:#7deeff}.label.pink{color:#ff8bc9}.score{min-width:66px;margin-top:3px;padding:2px 12px;border-radius:16px;font-size:24px;font-weight:900;border:2px solid #24dcf2;background:#09292f;color:#9ff8ff}.score.pink{border-color:#f36db8;background:#351225;color:#ffb4dc}.settings{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mode,.slider{border-radius:12px;background:#171725;padding:6px 8px}.mode{display:flex;gap:5px}.mode button{flex:1;background:#262638;color:#bbb;border:0;border-radius:8px;font-size:11px;font-weight:800}.mode button.active{background:linear-gradient(135deg,#155568,#61194f);color:#fff}.slider{font-size:10px;color:#aaaabd;font-weight:800}.row{display:flex;justify-content:space-between}.row strong{color:#fff}.slider input{width:100%;height:18px;accent-color:#bd67ff}.game{position:relative;flex:1;min-height:160px;display:flex;justify-content:center;align-items:center}.game canvas{display:block;width:100%;height:100%;border:3px solid #28283a;border-radius:17px;background:#030308;box-shadow:0 0 28px #000;touch-action:none}.overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82%;padding:14px;border-radius:14px;text-align:center;background:rgba(5,5,14,.9);border:1px solid #514466;pointer-events:none}.overlay strong{display:block;font-size:16px}.overlay span{display:block;margin-top:5px;font-size:11px;color:#aaa8ba}.hidden{display:none}.controls{display:flex;gap:8px}.controls button{flex:1;min-height:42px;border:0;border-radius:12px;background:#242435;color:#fff;font-size:13px;font-weight:800}.controls button:first-child{background:#176575}.hint{text-align:center;color:#77758a;font-size:10px;line-height:1.3;padding-bottom:1px}@media(max-height:620px){.app{padding-top:6px;gap:5px}h1{font-size:20px}.score{font-size:20px}.controls button{min-height:36px}.hint{display:none}}</style></head><body><main class="app"><header><h1>GRAVITY PONG</h1><div class="sub" id="status">Choose a mode to begin</div></header><div class="scores"><div class="scorebox"><div class="label" id="topLabel">AI</div><div class="score" id="topScore">0</div></div><b style="color:#7c7590">VS</b><div class="scorebox"><div class="label pink">PLAYER 2</div><div class="score pink" id="bottomScore">0</div></div></div><div class="settings"><div class="mode"><button id="aiBtn" class="active">HUMAN VS AI</button><button id="humanBtn">HUMAN VS HUMAN</button></div><label class="slider"><span class="row"><span>BALL SPEED</span><strong id="speedVal">100%</strong></span><input id="speed" type="range" min="60" max="160" value="100" step="10"></label><label class="slider"><span class="row"><span>BLACK HOLE SIZE</span><strong id="sizeVal">26</strong></span><input id="size" type="range" min="0" max="60" value="26"></label><label class="slider"><span class="row"><span>GRAVITY PULL</span><strong id="gravityVal">100%</strong></span><input id="gravity" type="range" min="0" max="200" value="100" step="10"></label></div><div class="game"><canvas id="canvas"></canvas><div class="overlay" id="overlay"><strong>TAP START TO PLAY</strong><span id="overlayText">Drag the lower half to move</span></div></div><div class="controls"><button id="start">START</button><button id="pause">PAUSE</button><button id="reset">RESET</button></div><div class="hint" id="hint">Human vs AI: drag the lower half<br>Each scorer’s paddle shrinks 10%; the loser recovers one size step</div></main><script>(()=>{const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let W=360,H=620,dpr=1,mode='ai',running=false,paused=false,raf=0,topScore=0,bottomScore=0,lastHitter='bottom',speed=1,gravity=1,stars=[];const ORIGINAL=120,SHRINK=.9;const top={x:120,y:35,w:ORIGINAL,h:14},bottom={x:120,y:0,w:ORIGINAL,h:14},ball={x:180,y:300,vx:0,vy:0,r:7},hole={x:180,y:310,r:26};function resize(){const r=c.getBoundingClientRect();W=360;H=Math.max(220,r.height*360/r.width);dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);top.y=35;bottom.y=H-49;hole.x=W/2;hole.y=H/2;clamp(top);clamp(bottom);draw()}function clamp(p){p.x=Math.max(0,Math.min(W-p.w,p.x))}function starsInit(){stars=[];for(let i=0;i<65;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:.4+Math.random()*1.5})}function scores(){$('topScore').textContent=topScore;$('bottomScore').textContent=bottomScore}function overlay(a,b){$('overlay').classList.toggle('hidden',!a);if(a){$('overlay').querySelector('strong').textContent=a;$('overlayText').textContent=b||''}}function resizePaddle(p,newWidth){const center=p.x+p.w/2;p.w=newWidth;p.x=center-p.w/2;clamp(p)}function awardPoint(scorer){const winner=scorer==='top'?top:bottom;const loser=scorer==='top'?bottom:top;resizePaddle(winner,Math.max(18,winner.w*SHRINK));resizePaddle(loser,Math.min(ORIGINAL,loser.w/SHRINK));if(scorer==='top')topScore++;else bottomScore++;scores();$('status').textContent=(scorer==='top'?'Top player':'Bottom player')+' scored • paddle sizes updated'}function serve(who){lastHitter=who;const p=who==='top'?top:bottom;ball.x=p.x+p.w/2;ball.y=who==='top'?p.y+p.h+14:p.y-14;ball.vx=(Math.random()-.5)*4;ball.vy=(who==='top'?1:-1)*(3.8+Math.random()*1.2)}function reset(){running=false;paused=false;topScore=bottomScore=0;top.w=bottom.w=ORIGINAL;scores();top.x=bottom.x=W/2-ORIGINAL/2;serve('bottom');$('start').textContent='START';$('pause').textContent='PAUSE';$('status').textContent='Choose a mode to begin';overlay('TAP START TO PLAY',mode==='ai'?'Drag the lower half to move':'One finger per paddle, simultaneously');cancelAnimationFrame(raf);draw()}function start(){if(!running){running=true;paused=false;serve('bottom');$('start').textContent='RESTART';$('status').textContent=mode==='ai'?'You control the lower paddle':'Two players: control both paddles';overlay();loop()}else{paused=false;$('pause').textContent='PAUSE';overlay();loop()}}function setMode(m){mode=m;$('aiBtn').classList.toggle('active',m==='ai');$('humanBtn').classList.toggle('active',m==='human');$('topLabel').textContent=m==='ai'?'AI':'PLAYER 1';$('hint').innerHTML=m==='ai'?'Human vs AI: drag the lower half<br>Each scorer’s paddle shrinks 10%; loser recovers one size step':'Human vs Human: one finger per paddle simultaneously<br>Each scorer’s paddle shrinks 10%; loser recovers one size step';reset()}function move(x,y){const r=c.getBoundingClientRect(),mx=(x-r.left)*W/r.width,my=(y-r.top)*H/r.height,p=my<H/2?top:bottom;if(mode==='ai'&&p===top)return;p.x=Math.max(0,Math.min(W-p.w,mx-p.w/2))}function paddleHit(p,dir,who){if(ball.y+ball.r>p.y&&ball.y-ball.r<p.y+p.h&&ball.x>p.x&&ball.x<p.x+p.w&&((dir<0&&ball.vy<0)||(dir>0&&ball.vy>0))){ball.y=dir<0?p.y+p.h+ball.r:p.y-ball.r;ball.vy=-ball.vy*1.04;ball.vx+=(ball.x-(p.x+p.w/2))*.085;lastHitter=who}}function update(){if(!running||paused)return;if(mode==='ai')top.x+=(ball.x-top.w/2-top.x)*.08;clamp(top);clamp(bottom);if(gravity>0&&hole.r>0){let dx=hole.x-ball.x,dy=hole.y-ball.y,d=Math.hypot(dx,dy)||1,f=165*gravity/(d*d+12);ball.vx+=dx/d*f;ball.vy+=dy/d*f}ball.x+=ball.vx*speed;ball.y+=ball.vy*speed;if(ball.x<ball.r||ball.x>W-ball.r){ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));ball.vx=-ball.vx*.93}paddleHit(top,-1,'top');paddleHit(bottom,1,'bottom');let sp=Math.hypot(ball.vx,ball.vy),max=10*speed;if(sp>max){ball.vx=ball.vx/sp*max;ball.vy=ball.vy/sp*max}if(hole.r>0&&Math.hypot(ball.x-hole.x,ball.y-hole.y)<hole.r+ball.r){awardPoint(lastHitter==='top'?'bottom':'top');serve(lastHitter==='top'?'bottom':'top');return}if(ball.y<0){awardPoint('bottom');serve('bottom')}else if(ball.y>H){awardPoint('top');serve('top')}}function draw(){ctx.fillStyle='#030308';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';stars.forEach(s=>ctx.fillRect(s.x,s.y,s.s,s.s));if(hole.r>0){ctx.shadowBlur=25;ctx.shadowColor='#9d34ff';ctx.fillStyle='#25004a';ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r+8,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r,0,7);ctx.fill();ctx.strokeStyle='#b152ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r+10,0,7);ctx.stroke();ctx.lineWidth=1}ctx.fillStyle='#20eaff';ctx.fillRect(top.x,top.y,top.w,top.h);ctx.fillStyle='#ff5caf';ctx.fillRect(bottom.x,bottom.y,bottom.w,bottom.h);ctx.fillStyle='#fff36b';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();if(paused){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2)}}function loop(){cancelAnimationFrame(raf);const f=()=>{update();draw();if(running&&!paused)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}function touch(e){e.preventDefault();if(!running){start();return}for(const t of e.changedTouches){if(e.type==='touchend'||e.type==='touchcancel')continue;move(t.clientX,t.clientY)}}function setValue(id,fn){$(id).oninput=e=>fn(+e.target.value)}$('aiBtn').onclick=()=>setMode('ai');$('humanBtn').onclick=()=>setMode('human');$('start').onclick=start;$('reset').onclick=reset;$('pause').onclick=()=>{if(running){paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE';if(!paused)loop();draw()}};setValue('speed',v=>{speed=v/100;$('speedVal').textContent=v+'%'});setValue('size',v=>{hole.r=v;$('sizeVal').textContent=v;draw()});setValue('gravity',v=>{gravity=v/100;$('gravityVal').textContent=v+'%'});['touchstart','touchmove','touchend','touchcancel'].forEach(e=>c.addEventListener(e,touch,{passive:false}));c.addEventListener('mousemove',e=>{if(e.buttons)move(e.clientX,e.clientY)});window.addEventListener('resize',()=>{resize();starsInit()});resize();starsInit();reset()})();</script></body></html>
