<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeCam</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin:0; background:#0f172a; color:#e2e8f0; }
  .header { background:#1e2937; padding:16px; text-align:center; font-size:24px; font-weight:700; }
  .container { padding:20px; max-width:480px; margin:0 auto; }
  .preview { width:100%; aspect-ratio:4/3; background:#1e2937; border-radius:16px; overflow:hidden; margin-bottom:20px; display:flex; align-items:center; justify-content:center; border:2px solid #334155; }
  .preview img { width:100%; height:100%; object-fit:cover; }
  .empty { color:#64748b; text-align:center; }
  .btn { width:100%; padding:18px; font-size:18px; font-weight:600; border:none; border-radius:16px; margin-bottom:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
  .btn-primary { background:#3b82f6; color:white; }
  .btn-secondary { background:#475569; color:white; }
  .btn-share { background:#10b981; color:white; }
  .actions { display:flex; gap:12px; }
  .actions .btn { flex:1; }
  .photo-list { display:flex; gap:8px; flex-wrap:wrap; margin-top:20px; }
  .thumb { width:70px; height:70px; border-radius:12px; overflow:hidden; border:2px solid #334155; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<div class="header">📷 ForgeCam</div>
<div class="container">
  <div id="preview" class="preview">
    <div class="empty">No photo yet.<br>Take or pick one!</div>
  </div>
  
  <button onclick="takePhoto()" class="btn btn-primary">
    📸 Take Photo
  </button>
  <button onclick="pickPhoto()" class="btn btn-secondary">
    🖼️ Pick from Gallery
  </button>
  
  <div id="share-section" style="display:none; margin-top:12px;">
    <button onclick="sharePhoto()" class="btn btn-share">
      📤 Share Photo
    </button>
  </div>
  
  <div id="gallery" class="photo-list"></div>
</div>

<script>
let currentPhoto = null;
let photos = [];

async function requestCamera() {
  try {
    await ForgeHost.permissions.request('camera');
    return true;
  } catch(e) {
    ForgeHost.toast('Camera permission needed');
    return false;
  }
}

function cleanB64(b64) {
  return String(b64 || '').replace(/\s+/g, '').replace(/^data:[^;]+;base64,/i, '');
}
function shotSrc(shot) {
  if (!shot) return '';
  const mime = shot.mime || 'image/jpeg';
  let b64 = cleanB64(shot.base64 || '');
  let dataUrl = shot.dataUrl || shot.dataURL || '';
  if (!b64 && dataUrl && /base64,/i.test(dataUrl)) b64 = cleanB64(dataUrl.split(/base64,/i).pop() || '');
  if (!dataUrl && b64) dataUrl = `data:${mime};base64,${b64}`;
  // Prefer dataUrl for simple apps; blob fallback if dataUrl fails to paint
  return { dataUrl, b64, mime };
}
function setImgWithFallback(img, shot) {
  const s = shotSrc(shot);
  if (!s.dataUrl && !s.b64) {
    img.removeAttribute('src');
    return false;
  }
  let blobUrl = null;
  img.onerror = function () {
    if (s.b64 && img.dataset.tried !== 'blob') {
      try {
        const bin = atob(s.b64);
        const bytes = new Uint8Array(bin.length);
        var __n = 0; while (__n < bin.length) { bytes[__n] = bin.charCodeAt(__n); __n++; }
        blobUrl = URL.createObjectURL(new Blob([bytes], { type: s.mime || 'image/jpeg' }));
        img.dataset.tried = 'blob';
        img.src = blobUrl;
        return;
      } catch (_) {}
    }
    ForgeHost.toast('Image failed to display');
  };
  img.src = s.dataUrl || '';
  if (!s.dataUrl && s.b64) {
    img.dataset.tried = 'blob';
    try {
      const bin = atob(s.b64);
      const bytes = new Uint8Array(bin.length);
      var __n = 0; while (__n < bin.length) { bytes[__n] = bin.charCodeAt(__n); __n++; }
      img.src = URL.createObjectURL(new Blob([bytes], { type: s.mime || 'image/jpeg' }));
    } catch (e) {
      return false;
    }
  }
  return true;
}

async function takePhoto() {
  if (!await requestCamera()) return;
  try {
    const shot = await ForgeHost.camera.takePhoto({ quality: 85, maxWidth: 1920, facing: 'back' });
    if (shot) addPhoto(shot);
    else ForgeHost.toast('No photo returned');
  } catch(e) {
    ForgeHost.toast('Failed: ' + (e && e.message ? e.message : e));
  }
}

async function pickPhoto() {
  try {
    const shot = await ForgeHost.camera.pickPhoto({ quality: 85, maxWidth: 1920 });
    if (shot) addPhoto(shot);
  } catch(e) {
    ForgeHost.toast('Failed: ' + (e && e.message ? e.message : e));
  }
}

function addPhoto(shot) {
  // Normalize so share/preview always have dataUrl
  const s = shotSrc(shot);
  if (s.dataUrl) shot.dataUrl = s.dataUrl;
  if (s.b64) shot.base64 = s.b64;
  currentPhoto = shot;
  photos.unshift(shot);
  if (photos.length > 6) photos.pop();

  const preview = document.getElementById('preview');
  preview.innerHTML = '';
  const img = document.createElement('img');
  img.alt = 'Photo';
  preview.appendChild(img);
  if (!setImgWithFallback(img, shot)) {
    preview.innerHTML = '<div class="empty">Photo data missing</div>';
    ForgeHost.toast('Photo had no image bytes');
    return;
  }

  document.getElementById('share-section').style.display = 'block';
  renderGallery();
}

function renderGallery() {
  const container = document.getElementById('gallery');
  container.innerHTML = '';
  photos.forEach((photo, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    const img = document.createElement('img');
    img.onclick = () => selectPhoto(i);
    div.appendChild(img);
    container.appendChild(div);
    setImgWithFallback(img, photo);
  });
}

function selectPhoto(index) {
  currentPhoto = photos[index];
  const preview = document.getElementById('preview');
  preview.innerHTML = '';
  const img = document.createElement('img');
  img.alt = 'Photo';
  preview.appendChild(img);
  setImgWithFallback(img, currentPhoto);
  document.getElementById('share-section').style.display = 'block';
}

async function sharePhoto() {
  if (!currentPhoto) return;
  try {
    const s = shotSrc(currentPhoto);
    await ForgeHost.share.file({
      name: 'forgecam-photo.jpg',
      mime: 'image/jpeg',
      dataUrl: s.dataUrl || undefined,
      base64: s.b64 || undefined
    });
  } catch(e) {
    ForgeHost.toast('Share failed');
  }
}

// Init
window.onload = () => {
  ForgeHost.toast('Ready to capture!');
};
</script>
</body>
</html>
