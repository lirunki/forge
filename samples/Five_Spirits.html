<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>五神 Five Spirits</title><style>:root{--bg:#0c0a08;--panel:#16130f;--panel2:#1e1a14;--gold:#c9a84c;--gold2:#f3e6c0;--ink:#f6f0e6;--muted:#9a8d78;--line:#c9a84c47;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-serif,Songti SC,Noto Serif,Georgia,serif}body{display:flex;flex-direction:column;overflow:hidden}button,input{font:inherit}.app{flex:1;display:flex;flex-direction:column;min-height:0;background:radial-gradient(ellipse at 50% 0%,#c9a84c1f,transparent 55%),radial-gradient(ellipse at 80% 80%,#c42b3a14,transparent 40%),var(--bg)}.top{padding:calc(12px + var(--safe-t)) 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;flex-direction:column}.brand b{font:600 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.28em;color:var(--gold)}.brand span{font-size:22px;font-weight:700}.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#ffffff0a;color:var(--gold2);font-size:18px}.main{flex:1;min-height:0;overflow:auto;padding:0 18px 18px}.nav{display:flex;gap:8px;padding:10px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:#0c0a08eb;backdrop-filter:blur(12px)}.nav button{flex:1;height:48px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.nav button.on{background:#c9a84c24;color:var(--gold2)}.lede{text-align:center;color:var(--muted);font-size:14px;line-height:1.55;max-width:34em;margin:0 auto 16px}.mandala-wrap{position:relative;width:min(100%,380px);aspect-ratio:1;margin:8px auto 18px}.mandala-wrap:before{content:'';position:absolute;left:50%;top:50%;width:68%;height:68%;border:1px solid #c9a84c55;transform:translate(-50%,-50%) rotate(45deg);pointer-events:none}.mandala-wrap:after{content:'';position:absolute;left:50%;top:50%;width:43%;height:43%;border:1px solid #c9a84c35;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.orb{position:absolute;width:94px;height:94px;border-radius:50%;border:1px solid #ffffff45;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;box-shadow:0 10px 24px #00000066;color:#fff}.orb .ch{font-size:31px;line-height:1}.orb .en{font:600 17px ui-sans-serif,system-ui,sans-serif;margin-top:6px}.orb .element{position:absolute;top:calc(100% + 10px);white-space:nowrap;font:600 17px ui-sans-serif,system-ui,sans-serif;color:#fff;text-shadow:0 2px 4px #000;letter-spacing:.02em}.orb.top{left:50%;top:1%;transform:translateX(-50%)}.orb.right{right:1%;top:50%;transform:translateY(-50%)}.orb.bottom{left:50%;bottom:1%;transform:translateX(-50%)}.orb.left{left:1%;top:50%;transform:translateY(-50%)}.orb.center{left:50%;top:50%;transform:translate(-50%,-50%);width:94px;height:94px}.orb.center .element{top:calc(100% + 10px);color:#fff}.orb.water{background:radial-gradient(circle at 35% 30%,#6ea3c4,#3a6b8c 55%,#163044)}.orb.wood{background:radial-gradient(circle at 35% 30%,#6cbc86,#3d8b5c 55%,#1c4a30)}.orb.fire{background:radial-gradient(circle at 35% 30%,#e25562,#c42b3a 55%,#6a121c)}.orb.earth{background:radial-gradient(circle at 35% 30%,#f0c44a,#d4a017 55%,#7a5a08);color:#241b08}.orb.metal{background:radial-gradient(circle at 35% 30%,#f4efe6,#d9d2c5 60%,#8a8376);color:#2a241c}.orb.metal .element,.orb.earth .element{color:#fff}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}.chip{border:1px solid var(--line);background:#ffffff08;color:var(--gold2);border-radius:999px;padding:10px 14px;font-size:13px;min-height:44px}.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 auto 12px;max-width:520px}.card h3{margin:0 0 8px;font-size:16px;color:var(--gold2)}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}.table-card{overflow:hidden;padding:0}.table-card h3{padding:16px 16px 8px;margin:0}.table-wrap{overflow-x:auto}.element-table{width:100%;border-collapse:collapse;min-width:560px;font:13px ui-sans-serif,system-ui,sans-serif}.element-table th{color:var(--gold);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:left;font-weight:600;background:#00000024}.element-table th,.element-table td{padding:11px 12px;border-top:1px solid #c9a84c1c;vertical-align:top}.element-table td{color:#e7dfd0;line-height:1.35}.element-table td:first-child{font-weight:700;color:var(--gold2)}.detail-hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}.badge{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:32px;flex-shrink:0;border:1px solid #ffffff26}.detail-hero h2{margin:0;font-size:28px}.py{color:var(--gold);letter-spacing:.16em;font:12px ui-sans-serif,system-ui,sans-serif}.sub{color:var(--muted);font-size:14px;margin-top:2px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.meta div{background:#00000040;border-radius:12px;padding:10px 12px}.meta k{display:block;font:10px ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}.meta span{font-size:14px}.prose{font-size:15px;line-height:1.65;color:#e7dfd0}.prose p{margin:0 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{flex:1;min-height:48px;border-radius:14px;border:0;background:linear-gradient(180deg,#d8b85a,var(--gold));color:#1a1408;font-weight:700;font-size:15px;padding:0 14px}.btn.ghost{background:#ffffff0d;color:var(--gold2);border:1px solid var(--line)}.btn:disabled{opacity:.55}.section{margin:16px 0 8px;font:12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}.art{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;background:#120f0c;border:1px solid var(--line);margin:10px 0}.art img{width:100%;height:100%;object-fit:cover}.ph,.empty{text-align:center;color:var(--muted);padding:28px 12px;line-height:1.5}.art .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ask{display:flex;gap:8px;margin-top:8px}.ask input{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#0000004d;color:var(--ink);padding:0 14px;font-size:15px}.answer{margin-top:10px;font-size:14px;line-height:1.6;color:#e7dfd0;white-space:pre-wrap}.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;color:var(--gold);font-size:15px;padding:0}.hide{display:none!important}.weave-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #c9a84c1f}.dot{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:16px;color:#fff}.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border-radius:14px;overflow:hidden;aspect-ratio:1;background:#120f0c;border:1px solid var(--line);position:relative;color:var(--gold2)}.tile img{width:100%;height:100%;object-fit:cover}.cap{position:absolute;left:0;right:0;bottom:0;padding:8px;font-size:12px;background:linear-gradient(transparent,#000000b3)}.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:#2a2318;color:var(--gold2);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:86%}.toast.show{opacity:1}@media(max-width:360px){.orb{width:82px;height:82px}.orb.center{width:82px;height:82px}.orb .ch{font-size:27px}.orb .en,.orb .element{font-size:15px}}</style></head><body><div class='app'><div class='top'><button class='back hide' id='backBtn' type='button'>← Spirits</button><div class='brand' id='brand'><b>WU SHEN</b><span>五神</span></div><button class='icon-btn' id='speakBtn' type='button'>音</button></div><div class='main' id='main'></div><div class='nav' id='nav'><button type='button' data-tab='home' class='on'>Mandala</button><button type='button' data-tab='weave'>Weave</button><button type='button' data-tab='gallery'>Gallery</button></div></div><div class='toast' id='toast'></div><script>const H=window.ForgeHost||window.forge;const DATA=[{id:'wood',ch:'魂',pinyin:'Hún',en:'Hun',element:'Wood',direction:'East',season:'Spring',notes:'Rising/expanding, green, growth',organ:'Liver',tag:'The wandering visionary',body:'Hun is the yang soul of planning, imagination, ethics, and dreams. It gives awareness a horizon and a life that is going somewhere.',balanced:'Purpose, creativity, compassion, and dreams that inform waking life.',disturbed:'Aimlessness, nightmares, irritability, or feeling unmoored.',cultivate:'Walk at dawn, name a direction, move the body, and let anger become a clean boundary.',prompt:'Ethereal Chinese ink-wash painting of Hun, the ethereal soul: three translucent jade-green figures rising like dawn mist from a forest of spring willows, white cranes, drifting clouds, liver-wood energy, poetic Song dynasty landscape, the character 魂, no English text',color:'#3d8b5c'},{id:'fire',ch:'神',pinyin:'Shén',en:'Shen',element:'Fire',direction:'South',season:'Summer',notes:'Radiating/ascending, red, peak',organ:'Heart',tag:'The emperor of awareness',body:'Shen is consciousness itself — the light that knows it is looking. In classical medicine it is the sovereign fire that illuminates the other spirits.',balanced:'Calm presence, restful sleep, clear insight, and warm joy.',disturbed:'Insomnia, anxiety, panic, or a scattered mind.',cultivate:'Evening quiet, fewer late fires, and meditation that rests attention in the chest.',prompt:'Traditional Chinese ink and mineral-pigment painting of Shen, the Heart Spirit: a luminous crimson-gold emperor of consciousness seated in a palace of fire and lotus light, Song dynasty sacred aesthetic, dark lacquer background, the character 神 faintly in gold, no English text',color:'#c42b3a'},{id:'earth',ch:'意',pinyin:'Yì',en:'Yi',element:'Earth',direction:'Center',season:'Late summer / transitions',notes:'Stabilizing/nourishing, yellow',organ:'Spleen',tag:'Thought that can digest',body:'Yi is intention — applied thought. It transforms experience into understanding and holds the center so the other spirits do not fly apart.',balanced:'Focus, learning that nourishes, and a stable center.',disturbed:'Rumination, worry loops, foggy thinking, or obsession.',cultivate:'One thing at a time. Warm regular meals, shorter study, rest, gardening, and cooking.',prompt:'Traditional Chinese painting of Yi, the intellect spirit: a golden earth scholar-spirit among millet fields and a still pond that reflects thought, yellow ochre mineral pigments, centered and nourishing, spleen-earth, the character 意, no English text',color:'#d4a017'},{id:'metal',ch:'魄',pinyin:'Pò',en:'Po',element:'Metal',direction:'West',season:'Autumn',notes:'Contracting/condensing, white',organ:'Lungs',tag:'The soul of bone and breath',body:'Po is the yin soul of sensation, instinct, and the animal intelligence of the body. It knows the weight of earth, breath, and what must be released.',balanced:'Embodiment, rich senses, healthy grief, and breath that reaches the body.',disturbed:'Numbness, clinging, shallow breathing, or grief that cannot metabolize.',cultivate:'Slow exhales, touch, walking, singing, and rituals of farewell.',prompt:'Chinese ink painting of Po, the corporeal soul: seven pale white-gold spirits dwelling in breath and bone, autumn mist over white metal mountains shaped like lungs, falling leaves, grounded Song dynasty aesthetic, the character 魄, no English text',color:'#a9a39a'},{id:'water',ch:'志',pinyin:'Zhì',en:'Zhi',element:'Water',direction:'North',season:'Winter',notes:'Descending/storing, black/dark blue',organ:'Kidneys',tag:'The deep will that outlasts mood',body:'Zhi is will — the deep current that continues when mood has gone. It is long memory, vocation, and the wisdom inside fear.',balanced:'Quiet determination, courage, and commitments that ripen over years.',disturbed:'Fear that freezes, burnout of will, or depleted drive.',cultivate:'Sleep in true dark, do less in winter, and choose one vow small enough to survive.',prompt:'Mysterious Chinese painting of Zhi, the will spirit: a deep indigo water dragon of willpower coiled in a winter mountain kidney-ocean, stars reflected in still black water, Tang dynasty mineral pigments, the character 志 in faint gold, no English text',color:'#3a6b8c'}];let images={},tab='home',current=null;function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('show'),2200)}function item(id){return DATA.find(x=>x.id===id)}function svg(id){let x=item(id);return '<div style=\'font-size:54px;color:'+x.color+'\'>'+x.ch+'</div>'}function header(detail){document.getElementById('backBtn').classList.toggle('hide',!detail);document.getElementById('brand').classList.toggle('hide',detail)}function renderHome(){current=null;header(false);let x=DATA.find(a=>a.id==='water'),w=DATA.find(a=>a.id==='wood'),f=DATA.find(a=>a.id==='fire'),m=DATA.find(a=>a.id==='metal'),e=DATA.find(a=>a.id==='earth');let orb=(a,pos,cl)=>'<button type=\'button\' class=\'orb '+pos+' '+cl+'\' data-open=\''+a.id+'\'><span class=\'ch\'>'+a.ch+'</span><span class=\'en\'>'+a.en+'</span><span class=\'element\'>'+a.element+'</span></button>';document.getElementById('main').innerHTML='<p class=\'lede\'>Five spirits, five phases, one living center. Tap a spirit to explore its place in the five-element map.</p><div class=\'mandala-wrap\'>'+orb(x,'top','water')+orb(w,'right','wood')+orb(f,'bottom','fire')+orb(m,'left','metal')+orb(e,'center','earth')+'</div><div class=\'chips\'>'+DATA.map(a=>'<button class=\'chip\' type=\'button\' data-open=\''+a.id+'\'>'+a.ch+' '+a.en+'</button>').join('')+'</div><div class=\'card\'><h3>How to use this</h3><p>Each spirit is a function, not a ghost in the machine. Zhi is placed at the top, Hun at the right, Shen at the bottom, Po at the left, and Yi at the center. Tap any spirit to learn more.</p></div><div class=\'card table-card\'><h3>Five directions and phases</h3><div class=\'table-wrap\'><table class=\'element-table\'><thead><tr><th>Element</th><th>Direction</th><th>Season</th><th>Other notes (common associations)</th></tr></thead><tbody>'+DATA.map(a=>'<tr><td>'+a.element+'</td><td>'+a.direction+'</td><td>'+a.season+'</td><td>'+a.notes+'</td></tr>').join('')+'</tbody></table></div></div>'}function renderDetail(id){let x=item(id);if(!x)return;current=x;header(true);document.getElementById('main').innerHTML='<div class=\'detail-hero\'><div class=\'badge\' style=\'background:'+x.color+'\'>'+x.ch+'</div><div><div class=\'py\'>'+x.pinyin.toUpperCase()+'</div><h2>'+x.en+'</h2><div class=\'sub\'>'+x.tag+'</div></div></div><div class=\'art\' id=\'art\'>'+(images[id]?'<img alt=\''+x.en+'\' src=\''+images[id]+'\'>':'<div class=\'ph\'>'+svg(id)+'<div>No painting yet — summon one below.</div></div>')+'</div><div class=\'row\'><button class=\'btn\' id=\'gen\'>Summon painting</button><button class=\'btn ghost\' id=\'share\'>Share</button></div><div class=\'meta\'><div><k>Element</k><span>'+x.element+'</span></div><div><k>Direction</k><span>'+x.direction+'</span></div><div><k>Season</k><span>'+x.season+'</span></div><div><k>Organ</k><span>'+x.organ+'</span></div><div style=\'grid-column:1/-1\'><k>Associations</k><span>'+x.notes+'</span></div></div><div class=\'section\'>Nature</div><div class=\'prose\'><p>'+x.body+'</p></div><div class=\'card\'><h3>When balanced</h3><p>'+x.balanced+'</p></div><div class=\'card\'><h3>When disturbed</h3><p>'+x.disturbed+'</p></div><div class=\'card\'><h3>Cultivate</h3><p>'+x.cultivate+'</p></div><div class=\'section\'>Ask the map</div><div class=\'ask\'><input id=\'q\' data-forge-persist placeholder=\'Ask about '+x.en+'\'><button class=\'btn\' id=\'ask\' style=\'flex:0 0 96px\'>Ask</button></div><div class=\'answer\' id=\'answer\'></div>';document.getElementById('gen').onclick=()=>generate(x);document.getElementById('share').onclick=()=>share(x);document.getElementById('ask').onclick=()=>ask(x)}function renderWeave(){current=null;header(false);document.getElementById('main').innerHTML='<p class=\'lede\'>The five are one court. Shen is the sovereign; the others are ministers.</p>'+DATA.map(x=>'<div class=\'weave-item\' data-open=\''+x.id+'\'><div class=\'dot\' style=\'background:'+x.color+'\'>'+x.ch+'</div><div><strong>'+x.pinyin+' · '+x.en+'</strong><p style=\'margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5\'>'+x.element+' · '+x.direction+' · '+x.season+'. '+x.tag+'.</p></div></div>').join('')+'<div class=\'card\' style=\'margin-top:16px\'><h3>Generating cycle</h3><p>Wood feeds Fire: vision fuels spirit. Fire creates Earth: insight becomes thought. Earth bears Metal: ideas take form. Metal holds Water: letting go reveals will. Water nourishes Wood: rest grows new direction.</p></div>'}function renderGallery(){current=null;header(false);document.getElementById('main').innerHTML='<p class=\'lede\'>Paintings you summon are kept on this device.</p><div class=\'gal\'>'+DATA.map(x=>'<button type=\'button\' class=\'tile\' data-open=\''+x.id+'\'>'+(images[x.id]?'<img alt=\''+x.en+'\' src=\''+images[x.id]+'\'><div class=\'cap\'>'+x.ch+' '+x.en+'</div>':svg(x.id)+'<div>'+x.ch+'</div>')+'</button>').join('')+'</div>'}function showTab(n){tab=n;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));n==='home'?renderHome():n==='weave'?renderWeave():renderGallery()}async function generate(x){let b=document.getElementById('gen');b.disabled=true;try{if(!H||!H.tools||!H.tools.run)throw Error('Host image tools unavailable');let r=await H.tools.run('image_generate',{prompt:x.prompt,n:1}),u=r&&r.images&&r.images[0]&&(r.images[0].url||r.images[0].dataUrl);if(!u)throw Error('No image returned. Set the xAI provider in Forge AI settings.');images[x.id]=u;try{await H.storage.set('img_'+x.id,u)}catch(e){}document.getElementById('art').innerHTML='<img alt=\''+x.en+'\' src=\''+u+'\'>';toast('Painting arrived')}catch(e){toast(e.message||'Could not generate')}finally{b.disabled=false}}async function share(x){try{let text=x.ch+' '+x.pinyin+' — '+x.en+'\n'+x.element+' · '+x.direction+' · '+x.season+'\n\n'+x.body;if(H&&H.share)await H.share({title:'五神 '+x.en,text:text});else if(H&&H.clipboard){await H.clipboard.write(text);toast('Copied')}}catch(e){toast('Share cancelled')}}async function ask(x){let q=document.getElementById('q').value,box=document.getElementById('answer');if(!q.trim()){toast('Ask a question first');return}box.textContent='Listening…';try{if(!H||!H.ai||!H.ai.chat)throw Error('Host AI is not available');let r=await H.ai.chat({prompt:'You are a careful teacher of classical Chinese medicine and Daoist inner cultivation. Explain clearly without medical claims or treatment plans. Focus: '+x.en+', '+x.element+', '+x.direction+'. User question: '+q});box.textContent=r.content||'No reply'}catch(e){box.textContent=e.message||'Could not ask right now.'}}async function speak(){let x=current||DATA[1],text=current?x.ch+', '+x.pinyin+', '+x.en+'. '+x.body:'五神。Shen, Hun, Po, Yi, Zhi. Five spirits of classical Chinese medicine.';try{if(H&&H.tts&&H.tts.speak)await H.tts.speak(text,{lang:'en-US'});else if(H&&H.ai&&H.ai.tts)await H.ai.tts({text:text,play:true});else toast('Voice not available')}catch(e){toast('Could not speak')}}async function load(){try{if(!H||!H.storage)return;for(let x of DATA){let v=await H.storage.get('img_'+x.id);if(typeof v==='string'&&v)images[x.id]=v}}catch(e){}}document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)};document.getElementById('main').onclick=e=>{let b=e.target.closest('[data-open]');if(b)renderDetail(b.dataset.open)};document.getElementById('backBtn').onclick=()=>showTab(tab);document.getElementById('speakBtn').onclick=speak;async function boot(){await load();renderHome()}if(H&&H.on)try{H.on('ready',boot)}catch(e){}boot();</script></body></html>
