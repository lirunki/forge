<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Trace Loop</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f5f0ff;color:#292044}body{display:flex;justify-content:center}.app{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;padding:18px 18px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:800;letter-spacing:-.8px}.subtitle{font-size:13px;color:#756d91;margin-top:4px}.new{border:0;border-radius:18px;background:#6d54e8;color:#fff;font-size:14px;font-weight:700;padding:13px 15px;box-shadow:0 5px 13px #6d54e844;white-space:nowrap}.new:active,.dir:active{transform:scale(.96)}.card{position:relative;flex:1;min-height:240px;margin:16px 0 12px;border-radius:30px;background:#fff;box-shadow:0 12px 30px #5d4b9218;overflow:hidden;touch-action:none}.hint{position:absolute;top:16px;left:0;right:0;text-align:center;z-index:2;font-size:14px;font-weight:700;color:#756d91;pointer-events:none}.hint b{color:#6d54e8}.canvas{display:block;width:100%;height:100%;touch-action:none}.controls{background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 8px 22px #5d4b9210;margin-bottom:11px}.controlRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.controlLabel{font-size:13px;font-weight:800;color:#756d91;text-transform:uppercase;letter-spacing:.6px}.direction{display:flex;gap:8px}.dir{border:0;border-radius:14px;padding:10px 12px;background:#f0ecff;color:#6d54e8;font-size:14px;font-weight:800}.dir.active{background:#6d54e8;color:#fff}.speedLine{display:flex;align-items:center;gap:10px;margin-top:9px}.speedLine span{font-size:13px;color:#756d91;font-weight:700}.speed{flex:1;accent-color:#6d54e8;height:24px}.bottom{display:flex;align-items:center;justify-content:space-between;padding:0 5px}.status{font-weight:800;font-size:16px}.rounds{font-size:13px;color:#81799c}.pulse{display:inline-block;width:9px;height:9px;background:#ff9d66;border-radius:50%;margin-right:6px;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}</style></head><body><main class="app"><header><div class="top"><div><div class="brand">Trace Loop ✨</div><div class="subtitle">Follow the moving dot all the way around</div></div><button class="new" id="newBtn">New pattern</button></div></header><section class="card" id="card"><div class="hint" id="hint"><b>Touch the dot</b> and follow it</div><canvas class="canvas" id="canvas"></canvas></section><section class="controls"><div class="controlRow"><div class="controlLabel">Direction</div><div class="direction"><button class="dir active" id="clockwise">↻ Clockwise</button><button class="dir" id="counter">↺ Reverse</button></div></div><div class="speedLine"><span>Slow</span><input class="speed" id="speed" type="range" min="0.35" max="2.2" step="0.05" value="1"><span>Fast</span></div></section><footer class="bottom"><div class="status"><span class="pulse"></span><span id="status">Ready to trace</span></div><div class="rounds" id="rounds">Circle 1 of 4</div></footer></main><script>(()=>{const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),card=document.getElementById('card'),status=document.getElementById('status'),rounds=document.getElementById('rounds'),hint=document.getElementById('hint'),newBtn=document.getElementById('newBtn'),speedInput=document.getElementById('speed'),clockwise=document.getElementById('clockwise'),counter=document.getElementById('counter');let w=0,h=0,dpr=1,pattern=0,t=0,last=0,down=false,lap=0,trail=[],direction=1,speed=1;const names=['Circle','Flower','Wave','Spiral'];function resize(){const r=card.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function point(a){const cx=w/2,cy=h/2+8,rx=Math.min(w*.34,150),ry=Math.min(h*.34,150);if(pattern===0)return{x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)};if(pattern===1){const q=1+.18*Math.sin(5*a);return{x:cx+rx*q*Math.cos(a),y:cy+ry*q*Math.sin(a)}}if(pattern===2)return{x:cx+rx*Math.cos(a),y:cy+ry*.55*Math.sin(2*a)};const r=rx*(.2+.8*((a%(Math.PI*2))/(Math.PI*2)));return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}}function drawPath(){ctx.save();ctx.lineWidth=3;ctx.setLineDash([2,11]);ctx.lineCap='round';ctx.strokeStyle='#d9d1f5';ctx.beginPath();for(let i=0;i<=260;i++){const p=point(i/260*Math.PI*2);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke();ctx.restore()}function drawDot(p){ctx.save();ctx.shadowColor='#ff9d66';ctx.shadowBlur=16;ctx.fillStyle='#ff9d66';ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-3,p.y-3,3,0,Math.PI*2);ctx.fill();ctx.restore()}function render(ms){if(!last)last=ms;const dt=Math.min(40,ms-last);last=ms;t+=dt*.0011*speed*direction;const a=((t%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);if((direction>0&&a<.012)||(direction<0&&a>Math.PI*2-.012))lap++;const p=point(a);trail=trail.filter(x=>ms-x.time<850);ctx.clearRect(0,0,w,h);drawPath();for(let i=1;i<trail.length;i++){const x=trail[i-1],y=trail[i];ctx.strokeStyle='rgba(109,84,232,'+Math.max(0,(y.time-(ms-850))/850*.75)+')';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x.x,x.y);ctx.lineTo(y.x,y.y);ctx.stroke()}drawDot(p);if(down){const q=trail[trail.length-1];if(q){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<42){status.textContent='Great tracing!';hint.style.opacity='.25'}else status.textContent='Keep following the dot'}}rounds.textContent=names[pattern]+' '+(lap+1)+' of 4';requestAnimationFrame(render)}function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,time:performance.now()}}function start(e){e.preventDefault();down=true;hint.textContent='Keep following the dot';trail.push(pos(e));try{canvas.setPointerCapture(e.pointerId)}catch(_){}status.textContent='Tracing…'}function move(e){if(!down)return;e.preventDefault();trail.push(pos(e));if(trail.length>120)trail.shift()}function end(){down=false;if(status.textContent==='Tracing…')status.textContent='Ready to trace';hint.innerHTML='<b>Touch the dot</b> and follow it';hint.style.opacity='1'}function next(){pattern=(pattern+1)%names.length;t=0;lap=0;trail=[];status.textContent='Ready to trace';hint.innerHTML='<b>Touch the dot</b> and follow it';hint.style.opacity='1'}function setDirection(value){direction=value;clockwise.classList.toggle('active',value===1);counter.classList.toggle('active',value===-1);status.textContent=value===1?'Going clockwise':'Going in reverse'}canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('pointerleave',e=>{if(down)move(e)});newBtn.addEventListener('click',next);clockwise.addEventListener('click',()=>setDirection(1));counter.addEventListener('click',()=>setDirection(-1));speedInput.addEventListener('input',e=>{speed=Number(e.target.value);status.textContent=speed<.8?'Nice and slow':speed>1.5?'Zooming!':'Ready to trace'});window.addEventListener('resize',resize);resize();requestAnimationFrame(render)})();</script></body></html>
