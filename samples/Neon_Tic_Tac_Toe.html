<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Tic-Tac-Toe</title><style>:root{--bg:#070b14;--panel:rgba(255,255,255,.05);--line:rgba(148,163,184,.2);--x:#22d3ee;--o:#f472b6;--text:#e2e8f0;--dim:#94a3b8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;padding:18px 16px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(800px 400px at 50% -10%,rgba(34,211,238,.13),transparent 65%),radial-gradient(700px 400px at 100% 100%,rgba(244,114,182,.1),transparent 65%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center}.wrap{width:100%;max-width:430px;display:flex;flex-direction:column;gap:15px}header{text-align:center;padding:4px 0}h1{margin:0;color:#fff;font-size:clamp(27px,8vw,36px);letter-spacing:.24em;text-shadow:0 0 18px rgba(34,211,238,.65)}.sub{color:var(--dim);font-size:13px;margin-top:7px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}button{font:inherit;color:var(--text);cursor:pointer;border:0}.mode button{min-height:44px;border-radius:13px;background:transparent;color:var(--dim);font-size:13px;font-weight:700}.mode button.active{background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(244,114,182,.13));color:#fff;box-shadow:0 0 18px rgba(34,211,238,.12)}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center}.score .label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}.score .val{font-size:25px;font-weight:800;margin-top:2px}.you .val{color:var(--x);text-shadow:0 0 15px rgba(34,211,238,.7)}.opponent .val{color:var(--o);text-shadow:0 0 15px rgba(244,114,182,.7)}.vs{align-self:center;color:var(--dim);font-weight:800}.status{text-align:center;min-height:24px;color:#fff;font-size:15px;font-weight:600}.board{width:min(88vw,365px);aspect-ratio:1;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;padding:13px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:0 22px 55px rgba(0,0,0,.48)}.cell{width:100%;height:100%;min-width:0;min-height:0;aspect-ratio:1 / 1;border:1px solid rgba(148,163,184,.13);border-radius:16px;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center;font-size:clamp(46px,15vw,66px);font-weight:800;line-height:1;transition:transform .12s,background .2s,box-shadow .2s}.cell:active{transform:scale(.93)}.cell:not(.filled):hover{background:rgba(34,211,238,.08)}.cell.x{color:var(--x);text-shadow:0 0 10px var(--x),0 0 28px rgba(34,211,238,.6)}.cell.o{color:var(--o);text-shadow:0 0 10px var(--o),0 0 28px rgba(244,114,182,.6)}.cell.win{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px currentColor,0 0 25px currentColor}.controls{display:flex;justify-content:center;gap:10px}.btn{min-height:48px;padding:0 21px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700}.btn.primary{border-color:rgba(34,211,238,.45);background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(34,211,238,.06));color:#a5f3fc}.btn:active{transform:scale(.95)}.brain{border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:12px 14px;color:var(--dim);font-size:13px;line-height:1.5;min-height:45px}.brain strong{color:#a5f3fc}.hidden{display:none}footer{text-align:center;color:rgba(148,163,184,.5);font-size:11px;margin-top:auto;padding-top:4px}</style></head><body><main class="wrap"><header><h1>TIC·TAC·TOE</h1><div class="sub" id="sub">You are ✕ · the LLM is ◯</div></header><div class="mode"><button id="aiMode" class="active">✦ VS LLM</button><button id="humanMode">♙ TWO PLAYERS</button></div><div class="scorebar"><div class="score you"><div class="label" id="xLabel">You (✕)</div><div class="val" id="scoreX">0</div></div><div class="vs">VS</div><div class="score opponent"><div class="label" id="oLabel">LLM (◯)</div><div class="val" id="scoreO">0</div></div></div><div class="status" id="status">Your turn — tap a square</div><div class="board" id="board"></div><div class="controls"><button class="btn primary" id="newGame">New game</button><button class="btn" id="reset">Reset score</button></div><div class="brain" id="brain"><strong id="brainTitle">AI THOUGHT PROCESS</strong><span id="brainText">The opponent will consider several moves ahead.</span></div><footer>Neon glass play · scores are saved automatically</footer></main><script>(function(){const F=window.ForgeHost||window.forge;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const $=id=>document.getElementById(id);let mode="ai",board=Array(9).fill(""),turn="X",over=false,busy=false,score={X:0,O:0};function save(){try{if(F&&F.state)F.state.set("ttt",JSON.stringify({score}))}catch(e){}}async function restore(){try{if(F&&F.state){const d=await F.state.get("ttt");if(d){const x=JSON.parse(d);if(x.score)score=Object.assign(score,x.score)}}}catch(e){}}function winner(){for(const line of wins){const[a,b,c]=line;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return{who:board[a],line}}return null}function empty(){return board.map((v,i)=>v?null:i).filter(i=>i!==null)}function render(){document.querySelectorAll(".cell").forEach((c,i)=>{const v=board[i];c.textContent=v==="X"?"×":v==="O"?"○":"";c.className="cell"+(v?" filled "+v.toLowerCase():"")})}function status(t){$("status").textContent=t}function updateScore(){$("scoreX").textContent=score.X;$("scoreO").textContent=score.O}function setMode(m){mode=m;$("aiMode").classList.toggle("active",m==="ai");$("humanMode").classList.toggle("active",m==="human");$("sub").textContent=m==="ai"?"You are ✕ · the LLM is ◯":"Player 1 is ✕ · Player 2 is ◯";$("xLabel").textContent=m==="ai"?"You (✕)":"Player 1 (✕)";$("oLabel").textContent=m==="ai"?"LLM (◯)":"Player 2 (◯)";$("brain").classList.toggle("hidden",m!=="ai");newGame()}function newGame(){board=Array(9).fill("");turn="X";over=false;busy=false;render();status(mode==="ai"?"Your turn — tap a square":"Player 1's turn — tap a square")}function end(w){over=true;if(w){w.line.forEach(i=>document.querySelectorAll(".cell")[i].classList.add("win"));score[w.who]++;status(mode==="ai"?(w.who==="X"?"You win! 🎉":"The LLM wins."):(w.who==="X"?"Player 1 wins! 🎉":"Player 2 wins!"))}else{status("Draw — well played.")}updateScore();save()}function localMove(){const e=empty();if(!e.length)return null;let best=-Infinity,choice=e[0];for(const i of e){board[i]="O";let val=minimax(false);board[i]="";if(val>best){best=val;choice=i}}return choice}function minimax(maximizing){const w=winner();if(w)return w.who==="O"?10:-10;if(!empty().length)return 0;let best=maximizing?-Infinity:Infinity;for(const i of empty()){board[i]=maximizing?"O":"X";const v=minimax(!maximizing);board[i]="";best=maximizing?Math.max(best,v):Math.min(best,v)}return best}async function aiTurn(){busy=true;status("LLM is thinking…");$("brainText").textContent="Calculating several moves ahead…";let move,reason="Built-in lookahead selected a strong move.";try{if(!F||!F.ai)throw Error("no ai");const text=board.map(v=>v||"-").join("");const r=await F.ai.chat({messages:[{role:"user",content:"Play tic-tac-toe as O. Board cells are row-major: "+text+". Choose the strongest legal move, prioritizing wins, blocks, forks, and center. Reply exactly MOVE: number\\nREASON: short sentence."}],temperature:.2});const out=String(r&&r.content||"");const m=out.match(/MOVE:\s*([1-9])/i);move=m?Number(m[1])-1:null;const q=out.match(/REASON:\s*(.+)/i);if(q)reason=q[1].trim()}catch(e){move=null}if(move==null||board[move])move=localMove();busy=false;if(over)return;board[move]="O";render();$("brainText").textContent=reason;const w=winner();if(w)return end(w);if(!empty().length)return end(null);turn="X";status("Your turn — tap a square")}function tap(i){if(over||busy||board[i])return;board[i]=turn;render();const w=winner();if(w)return end(w);if(!empty().length)return end(null);if(mode==="ai"){turn="O";aiTurn()}else{turn=turn==="X"?"O":"X";status(turn==="X"?"Player 1's turn — tap a square":"Player 2's turn — tap a square")}}async function init(){for(let i=0;i<9;i++){const c=document.createElement("button");c.className="cell";c.addEventListener("click",()=>tap(i));$("board").appendChild(c)}await restore();updateScore();$("aiMode").onclick=()=>setMode("ai");$("humanMode").onclick=()=>setMode("human");$("newGame").onclick=newGame;$("reset").onclick=()=>{score={X:0,O:0};updateScore();save();newGame();try{F&&F.toast&&F.toast("Score reset")}catch(e){}};newGame()}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init()})();</script></body></html>
