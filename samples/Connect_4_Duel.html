<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Connect 4 Duel</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#101a3b,#203a83);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;padding:18px 12px 28px}main{width:100%;max-width:430px;text-align:center}h1{margin:2px 0 3px;font-size:25px;letter-spacing:.5px}h1 b{color:#ff5d72}h1 em{color:#ffd447;font-style:normal}.sub{color:#aebbe3;font-size:13px;margin-bottom:15px}.scores{display:flex;gap:8px;margin-bottom:12px}.score{flex:1;background:#ffffff12;border:1px solid #ffffff18;border-radius:14px;padding:8px}.score small{display:block;color:#aebbe3;text-transform:uppercase;font-size:10px;letter-spacing:1px}.score strong{font-size:22px}.you strong{color:#ff5d72}.cpu strong{color:#ffd447}.status{height:34px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;background:#ff5d72}.board{width:100%;aspect-ratio:7/6;background:#2860d4;padding:10px;border-radius:19px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:7px;box-shadow:0 14px 30px #0006,inset 0 2px 5px #ffffff55}.slot{border-radius:50%;background:#0c1b55;box-shadow:inset 0 3px 6px #0008;cursor:pointer;position:relative}.piece{position:absolute;inset:5%;border-radius:50%;animation:drop .24s ease-out}.red{background:radial-gradient(circle at 32% 25%,#ffadb6,#ff5d72 48%,#b92039);box-shadow:inset 0 -4px 6px #8d152c,0 3px 5px #0006}.yellow{background:radial-gradient(circle at 32% 25%,#fff2a8,#ffd447 48%,#cb980d);box-shadow:inset 0 -4px 6px #a87600,0 3px 5px #0006}@keyframes drop{from{transform:translateY(-80%) scale(.8);opacity:.2}to{transform:translateY(0) scale(1);opacity:1}}.win{animation:pulse .55s infinite alternate}@keyframes pulse{to{transform:scale(1.1)}}.buttons{display:flex;gap:9px;margin-top:15px}button{flex:1;border:0;border-radius:14px;padding:14px 8px;font:700 14px system-ui;color:#fff;cursor:pointer}button:active{transform:scale(.96)}.new{background:linear-gradient(135deg,#ff5d72,#dc3450);box-shadow:0 6px 15px #ff5d7244}.secondary{background:#ffffff18;border:1px solid #ffffff20}.levels{display:flex;gap:6px;margin-top:10px}.level{flex:1;padding:10px 4px;border-radius:11px;background:#ffffff0e;color:#aebbe3;border:1px solid #ffffff18;font-size:12px;font-weight:700;cursor:pointer}.level.active{color:#ffd447;background:#ffd44720;border-color:#ffd44788}.overlay{position:fixed;inset:0;background:#08102bd9;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.card{width:100%;max-width:320px;background:#1d316b;border:1px solid #ffffff25;border-radius:22px;padding:27px 22px;text-align:center;box-shadow:0 20px 60px #0009}.card .emoji{font-size:42px}.card h2{margin:8px 0 5px}.card p{margin:0 0 18px;color:#b5c1e5;font-size:13px}</style></head><body><main><h1><b>CONNECT</b> <em>4</em> DUEL</h1><div class="sub">Drop four discs in a row before the AI does</div><div class="scores"><div class="score you"><small>You</small><strong id="you">0</strong></div><div class="score"><small>Draws</small><strong id="draw">0</strong></div><div class="score cpu"><small>AI</small><strong id="ai">0</strong></div></div><div class="status" id="status"><span class="dot"></span>Your turn</div><div class="board" id="board"></div><div class="buttons"><button class="secondary" id="undo">Undo</button><button class="new" id="new">New game</button></div><div class="levels"><div class="level" data-level="easy">Easy</div><div class="level active" data-level="medium">Medium</div><div class="level" data-level="hard">Hard</div></div></main><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="emoji">🎉</div><h2 id="result">You win!</h2><p id="detail">Great four in a row.</p><button class="new" id="again">Play again</button></div></div><script>(function(){'use strict';const R=6,C=7,H=1,A=2;let b=[],turn=H,locked=false,over=false,history=[],level='medium',score={you:0,ai:0,draw:0};const board=document.getElementById('board'),status=document.getElementById('status'),overlay=document.getElementById('overlay');function reset(){b=Array.from({length:R},()=>Array(C).fill(0));turn=H;locked=false;over=false;history=[];overlay.classList.remove('show');render();setStatus('Your turn',false)}function render(){board.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){let s=document.createElement('div');s.className='slot';s.dataset.c=c;s.onclick=()=>human(c);if(b[r][c]){let p=document.createElement('div');p.className='piece '+(b[r][c]===H?'red':'yellow');s.appendChild(p)}board.appendChild(s)}}function setStatus(text,thinking){status.innerHTML='<span class="dot" style="background:'+(thinking?'#ffd447':'#ff5d72')+'"></span>'+text}function row(c){for(let r=R-1;r>=0;r--)if(!b[r][c])return r;return -1}function human(c){if(locked||over||turn!==H)return;let r=row(c);if(r<0)return;move(r,c,H);if(!finish(H)){turn=A;locked=true;setStatus('AI is thinking…',true);setTimeout(ai,260)}}function move(r,c,p){b[r][c]=p;history.push([r,c]);render()}function ai(){if(over)return;let c=choose();let r=row(c);if(r>=0)move(r,c,A);locked=false;if(finish(A))return;turn=H;setStatus('Your turn',false)}function choose(){let cols=valid();if(level==='easy')return cols[Math.floor(Math.random()*cols.length)];for(let c of cols)if(wouldWin(c,A))return c;for(let c of cols)if(wouldWin(c,H))return c;if(level==='medium'){let good=cols.filter(c=>[2,3,4].includes(c));return (good.length?good:cols)[Math.floor(Math.random()*(good.length?good.length:cols.length))]}let best=cols[0],value=-Infinity;for(let c of cols){let r=row(c);b[r][c]=A;let v=evalBoard();b[r][c]=0;if(v>value){value=v;best=c}}return best}function valid(){return Array.from({length:C},(_,c)=>c).filter(c=>row(c)>=0)}function wouldWin(c,p){let r=row(c);if(r<0)return false;b[r][c]=p;let w=win(p);b[r][c]=0;return !!w}function win(p){for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(b[r][c]===p){for(let[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let cells=[[r,c]],ok=true;for(let k=1;k<4;k++){let nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>=R||nc<0||nc>=C||b[nr][nc]!==p){ok=false;break}cells.push([nr,nc])}if(ok)return cells}}return null}function evalBoard(){let v=0;for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(b[r][c]===A)v+=4-Math.abs(3-c);else if(b[r][c]===H)v-=4-Math.abs(3-c);return v+Math.random()}function finish(p){let cells=win(p);if(cells){over=true;locked=false;if(p===H)score.you++;else score.ai++;show(p===H?'🎉':'🤖',p===H?'You win!':'AI wins',p===H?'Four in a row — brilliant!':'The AI got four this time.',cells);return true}if(!valid().length){over=true;score.draw++;show('🤝',"It's a draw",'The board is full.',null);return true}return false}function show(e,t,d,cells){document.getElementById('emoji').textContent=e;document.getElementById('result').textContent=t;document.getElementById('detail').textContent=d;document.getElementById('you').textContent=score.you;document.getElementById('ai').textContent=score.ai;document.getElementById('draw').textContent=score.draw;if(cells){setTimeout(()=>cells.forEach(([r,c])=>{let i=r*C+c,x=board.children[i].firstChild;if(x)x.classList.add('win')}),20)}setTimeout(()=>overlay.classList.add('show'),cells?420:180)}function undo(){if(locked||!history.length)return;let count=turn===H?1:2;while(count--&&history.length){let[r,c]=history.pop();b[r][c]=0}over=false;turn=H;render();setStatus('Your turn',false)}document.getElementById('new').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('undo').onclick=undo;document.querySelectorAll('.level').forEach(x=>x.onclick=()=>{document.querySelectorAll('.level').forEach(y=>y.classList.remove('active'));x.classList.add('active');level=x.dataset.level});reset()})();</script></body></html>
