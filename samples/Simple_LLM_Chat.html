<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Simple LLM Chat</title><style>:root{color-scheme:dark;--bg:#0b0d12;--panel:#151923;--panel2:#1d2230;--line:#2b3242;--text:#f4f6fb;--muted:#9ba5b7;--accent:#8b7cff;--accent2:#a99fff;--danger:#ff7d91;--ok:#7fe0b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#24213d 0,#0b0d12 44%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}header{padding:24px 4px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{font-size:25px;line-height:1.15;margin:0 0 7px;letter-spacing:-.5px}header p{margin:0;color:var(--muted);font-size:14px}.settings{width:165px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px 11px}.settings label{display:block;color:#778198;font-size:11px;margin-bottom:5px}.settings select{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:13px;font-weight:650}.settings option{background:#171b25}.provider-state{font-size:10px;color:#778198;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.provider-state.ok{color:var(--ok)}.chat{flex:1;overflow-y:auto;padding:8px 0 18px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;text-align:center;max-width:320px;color:var(--muted);padding:30px 10px}.empty-icon{width:55px;height:55px;border-radius:18px;background:linear-gradient(135deg,#8b7cff,#5d51c8);display:grid;place-items:center;margin:0 auto 18px;font-size:25px;box-shadow:0 12px 30px #6c5cff30}.empty h2{color:var(--text);font-size:19px;margin:0 0 8px}.empty p{font-size:14px;line-height:1.55;margin:0}.message{display:flex;gap:10px;align-items:flex-start;animation:pop .2s ease-out}.message.user{justify-content:flex-end}.bubble{max-width:88%;padding:12px 14px;border-radius:17px;background:var(--panel);border:1px solid var(--line);font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--accent);border-color:transparent;border-bottom-right-radius:5px}.assistant .bubble{border-bottom-left-radius:5px}.avatar{width:29px;height:29px;flex:0 0 29px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:#2b3150;color:#c9c4ff;margin-top:2px}.typing{display:flex;gap:5px;align-items:center;padding:15px 16px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:bounce 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}.composer{padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid #202532;background:linear-gradient(180deg,#0b0d1200,#0b0d12 16%)}.composer-box{display:flex;gap:9px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px #0003}.composer textarea{flex:1;resize:none;min-height:42px;max-height:150px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;line-height:1.45;padding:9px 0}.composer textarea::placeholder{color:#737c8e}.send{width:43px;height:43px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:19px;cursor:pointer}.send:disabled{opacity:.45}.bottom-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 0;color:#687286;font-size:11px}.clear{border:0;background:none;color:#8993a7;font-size:12px;padding:5px;cursor:pointer}.status{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.error{color:var(--danger);font-size:13px;text-align:center;padding:8px 12px}.mode{display:flex;align-items:center;gap:8px;margin-top:12px;padding:0 4px;color:var(--muted);font-size:12px}.switch{position:relative;width:42px;height:24px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#303747;border-radius:20px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#aab2c2;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(18px);background:#fff}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}</style></head><body><main><header><div><h1>Simple LLM Chat</h1><p>Ask anything, get a clear response.</p></div><div class="settings"><label for="provider">LLM provider</label><select id="provider" disabled><option>Loading providers…</option></select><div id="providerState" class="provider-state">Checking configured providers</div></div></header><section id="chat" class="chat"><div class="empty" id="empty"><div class="empty-icon">✦</div><h2>Start a conversation</h2><p>Select a provider, choose a response mode, and send a prompt.</p></div></section><div id="error" class="error" hidden></div><form id="form" class="composer"><div class="composer-box"><textarea id="prompt" rows="1" placeholder="Type your prompt…" autocomplete="off"></textarea><button class="send" id="send" type="submit" aria-label="Send">↑</button></div><div class="mode"><label class="switch"><input id="streaming" type="checkbox"><span class="slider"></span></label><span>Streaming responses</span></div><div class="bottom-row"><span class="status" id="status">Ready</span><button type="button" class="clear" id="clear">Clear chat</button></div></form></main><script>const host=window.ForgeHost||window.forge,providerEl=document.getElementById('provider'),providerState=document.getElementById('providerState'),chatEl=document.getElementById('chat'),emptyEl=document.getElementById('empty'),form=document.getElementById('form'),promptEl=document.getElementById('prompt'),sendEl=document.getElementById('send'),clearEl=document.getElementById('clear'),errorEl=document.getElementById('error'),statusEl=document.getElementById('status'),streamingEl=document.getElementById('streaming');let messages=[],busy=false;function showError(t){errorEl.textContent=t;errorEl.hidden=!t}function idOf(p){return typeof p==='string'?p:(p?.id||p?.name||p?.provider||'')}function nameOf(p){return typeof p==='string'?p:(p?.label||p?.name||p?.id||p?.provider||'Unnamed provider')}function normalize(r){let x=r?.providers??r?.data??r;if(!Array.isArray(x)&&x&&typeof x==='object')x=Object.entries(x).map(([id,v])=>typeof v==='string'?{id,name:v}:{id,...v});return Array.isArray(x)?x:[]}function addMessage(role,text){emptyEl.style.display='none';messages.push({role,content:text});const row=document.createElement('div');row.className='message '+role;const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'You':'AI';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;if(role==='assistant')row.append(avatar,bubble);else row.append(bubble);chatEl.appendChild(row);chatEl.scrollTop=chatEl.scrollHeight;return bubble}function addTyping(){const row=document.createElement('div');row.className='message assistant';row.id='typing';row.innerHTML='<div class="avatar">AI</div><div class="bubble typing"><i></i><i></i><i></i></div>';chatEl.appendChild(row);chatEl.scrollTop=chatEl.scrollHeight}function autoSize(){promptEl.style.height='auto';promptEl.style.height=Math.min(promptEl.scrollHeight,150)+'px'}async function loadProviders(){try{if(!host?.ai)throw Error();const result=await host.ai.listProviders(),list=normalize(result).filter(p=>idOf(p));providerEl.innerHTML='';if(!list.length){providerEl.innerHTML='<option value="">No providers configured</option>';providerState.textContent='Configure a provider in AI settings';statusEl.textContent='Provider required';return}list.forEach(p=>{const o=document.createElement('option');o.value=idOf(p);o.textContent=nameOf(p);providerEl.appendChild(o)});try{const current=await host.ai.getProvider(),cid=idOf(current);if(cid&&[...providerEl.options].some(o=>o.value===cid))providerEl.value=cid}catch(e){}providerEl.disabled=false;providerState.textContent=list.length+' provider'+(list.length===1?'':'s')+' available';providerState.className='provider-state ok'}catch(e){providerEl.innerHTML='<option>Provider list unavailable</option>';providerState.textContent='Check Forge AI settings';statusEl.textContent='AI unavailable';showError('Could not load providers. Check your Forge AI settings.')}}providerEl.addEventListener('change',async()=>{showError('');try{await host.ai.setProvider(providerEl.value);providerState.textContent='Selected: '+providerEl.options[providerEl.selectedIndex].text}catch(e){showError('Could not select that provider.')}});form.addEventListener('submit',async e=>{e.preventDefault();const text=promptEl.value.trim();if(!text||busy)return;if(!providerEl.value){showError('Select a configured provider first.');return}busy=true;sendEl.disabled=true;showError('');addMessage('user',text);promptEl.value='';autoSize();statusEl.textContent=streamingEl.checked?'Streaming…':'Thinking…';let assistantText='';try{if(streamingEl.checked){const row=document.createElement('div');row.className='message assistant';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent='AI';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent='';row.append(avatar,bubble);chatEl.appendChild(row);const result=await host.ai.chatStream({messages,onToken:token=>{const value=typeof token==='string'?token:(token?.content??token?.text??'');assistantText+=value;bubble.textContent=assistantText;chatEl.scrollTop=chatEl.scrollHeight}});if(!assistantText){assistantText=result?.content??result?.text??'No response received.';bubble.textContent=assistantText}messages.push({role:'assistant',content:assistantText})}else{addTyping();const result=await host.ai.chat({messages}),answer=result?.content??result?.message?.content??result?.text??'No response received.';document.getElementById('typing')?.remove();addMessage('assistant',typeof answer==='string'?answer:JSON.stringify(answer))}statusEl.textContent='Ready'}catch(err){document.getElementById('typing')?.remove();statusEl.textContent='Ready';showError(err?.message||'Something went wrong while generating a response.')}finally{busy=false;sendEl.disabled=false;promptEl.focus()}});promptEl.addEventListener('input',autoSize);promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});clearEl.addEventListener('click',()=>{messages=[];chatEl.innerHTML='';chatEl.appendChild(emptyEl);emptyEl.style.display='block';showError('');statusEl.textContent='Ready';promptEl.focus()});loadProviders();promptEl.focus();</script></body></html>
