<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Space Invaders</title><style>body{margin:0;padding:0;background:#050505;color:#0f0;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh} .container{width:100%;max-width:400px;background:#111;border:2px solid #0f0;border-radius:8px;overflow:hidden;box-shadow:0 0 20px rgba(0,255,0,0.4)} .header{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;background:#1a1a1a} .header span{color:#0f0;text-shadow:0 0 5px #0f0} canvas{display:block;background:#000;border-bottom:2px solid #0f0} .controls{display:flex;padding:12px;gap:12px;align-items:flex-end;background:#1a1a1a} .joystick-container{width:110px;height:110px;background:rgba(0,255,0,0.08);border:3px solid #0f0;border-radius:50%;position:relative;touch-action:none;box-shadow:0 0 12px #0f0} .joystick-knob{width:38px;height:38px;background:#0f0;border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 8px #0f0} .buttons{display:flex;flex-direction:column;gap:8px;margin-left:auto} .btn{width:78px;height:48px;border:none;border-radius:6px;font-family:monospace;font-weight:bold;font-size:15px;cursor:pointer;touch-action:none;box-shadow:0 0 8px currentColor} .fire{background:#c00;color:#fff} .pause{background:#222;color:#0f0;border:2px solid #0f0} .speed{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1a1a1a;font-size:12px} .speed input{flex:1} .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:20} .overlay-content{text-align:center;color:#0f0} .overlay-content h1{margin:0 0 8px;font-size:26px;letter-spacing:2px;text-shadow:0 0 10px #0f0} .overlay-content button{padding:10px 32px;background:#0f0;color:#000;border:none;font-size:16px;font-weight:bold;border-radius:4px}</style></head><body><div class="container"><div class="header"><div>SCORE <span id="score">0</span></div><div>LIVES <span id="lives">3</span></div><div>LVL <span id="level">1</span></div></div><div id="game-container" style="position:relative;width:360px;margin:0 auto"><canvas id="game" width="360" height="480"></canvas><div id="overlay" class="overlay"><div class="overlay-content"><h1>SPACE INVADERS</h1><p style="margin:0 0 16px;font-size:11px;opacity:0.8">Defend Earth from the invasion!</p><button id="start-btn">START GAME</button></div></div></div><div class="controls"><div id="joystick-container" class="joystick-container"><div id="joystick-knob" class="joystick-knob"></div></div><div class="buttons"><button id="fire-btn" class="btn fire">FIRE</button><button id="pause-btn" class="btn pause">PAUSE</button></div></div><div class="speed"><span>SPEED</span><input type="range" id="speed-slider" min="0.5" max="3.5" step="0.1" value="1"><span id="speed-val">1.0</span>x</div></div><script>const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');const scoreEl=document.getElementById('score');const livesEl=document.getElementById('lives');const levelEl=document.getElementById('level');const overlay=document.getElementById('overlay');const startBtn=document.getElementById('start-btn');const fireBtn=document.getElementById('fire-btn');const pauseBtn=document.getElementById('pause-btn');const speedSlider=document.getElementById('speed-slider');const speedVal=document.getElementById('speed-val');const joyContainer=document.getElementById('joystick-container');const joyKnob=document.getElementById('joystick-knob');let score=0,lives=3,level=1,gameSpeed=1.0,paused=false,gameOver=false,gameStarted=false;let player={x:164,y:430,w:32,h:18};let invaders=[];let playerBullets=[];let enemyBullets=[];let invaderDir=1;let invaderMoveCounter=0;let lastFireTime=0;let joyX=0;let activePointer=null;const playerSpeed=4.2;const bulletSpeed=7.5;const enemyBulletSpeed=3.2;let stars=[];let particles=[];function initStars(){stars=[];for(let i=0;i<35;i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height});}}function initInvaders(){invaders=[];for(let r=0;r<5;r++){for(let c=0;c<8;c++){let pts=10+(4-r)*5;invaders.push({x:22+c*40,y:38+r*26,w:28,h:18,alive:true,points:pts});}}invaderDir=1;}function createExplosion(x,y,color='#0f0'){for(let i=0;i<12;i++){particles.push({x:x+(Math.random()-0.5)*5,y:y+(Math.random()-0.5)*5,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-1,life:15+Math.random()*20,size:1.5+Math.random()*2.5,color:color});}}function resetGame(){score=0;lives=3;level=1;paused=false;gameOver=false;gameStarted=true;player.x=canvas.width/2-player.w/2;initInvaders();playerBullets=[];enemyBullets=[];particles=[];invaderDir=1;invaderMoveCounter=0;lastFireTime=Date.now();updateUI();}function updateUI(){scoreEl.textContent=score;livesEl.textContent=lives;levelEl.textContent=level;}function fire(){if(!gameStarted||paused||gameOver)return;const now=Date.now();if(now-lastFireTime<210/gameSpeed)return;lastFireTime=now;playerBullets.push({x:player.x+player.w/2-2,y:player.y-4,w:4,h:11});}function enemyShoot(){const alive=invaders.filter(i=>i.alive);if(alive.length===0)return;alive.sort((a,b)=>b.y-a.y);const shooter=alive[Math.floor(Math.random()*Math.min(3,alive.length))];enemyBullets.push({x:shooter.x+shooter.w/2-1.5,y:shooter.y+shooter.h,w:3,h:9});}function moveInvaders(){let hitEdge=false;invaders.forEach(inv=>{if(!inv.alive)return;inv.x+=invaderDir*6;if(inv.x<5||inv.x+inv.w>canvas.width-5)hitEdge=true;});if(hitEdge){invaderDir=-invaderDir;invaders.forEach(inv=>{if(inv.alive)inv.y+=12;});}}function rectCollide(a,b){return!(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);}function checkCollisions(){for(let i=playerBullets.length-1;i>=0;i--){const b=playerBullets[i];for(let inv of invaders){if(inv.alive&&rectCollide(b,inv)){inv.alive=false;score+=inv.points;createExplosion(inv.x+inv.w/2,inv.y+inv.h/2);playerBullets.splice(i,1);break;}}}for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];if(rectCollide(b,player)){enemyBullets.splice(i,1);createExplosion(player.x+player.w/2,player.y+player.h/2,'#f33');loseLife();break;}}}function loseLife(){lives--;if(lives<=0){gameOver=true;}else{player.x=canvas.width/2-player.w/2;playerBullets=[];enemyBullets=[];}}function nextLevel(){level++;score+=180;initInvaders();playerBullets=[];enemyBullets=[];}function update(){if(!gameStarted||paused||gameOver)return;player.x+=joyX*playerSpeed*gameSpeed;if(player.x<0)player.x=0;if(player.x>canvas.width-player.w)player.x=canvas.width-player.w;for(let i=playerBullets.length-1;i>=0;i--){const b=playerBullets[i];b.y-=bulletSpeed*gameSpeed;if(b.y<0)playerBullets.splice(i,1);}for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.y+=enemyBulletSpeed*gameSpeed;if(b.y>canvas.height)enemyBullets.splice(i,1);}invaderMoveCounter+=gameSpeed;if(invaderMoveCounter>=24){moveInvaders();invaderMoveCounter=0;}if(Math.random()<0.018*gameSpeed&&enemyBullets.length<4){enemyShoot();}checkCollisions();for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*gameSpeed;p.y+=p.vy*gameSpeed;p.life-=gameSpeed;if(p.life<=0)particles.splice(i,1);}if(invaders.filter(i=>i.alive).length===0){nextLevel();}if(invaders.some(i=>i.alive&&i.y+i.h>player.y-8)){loseLife();}}function draw(){ctx.fillStyle='#000011';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(10,0,30,0.4)';ctx.fillRect(0,50,canvas.width,150);ctx.fillStyle='rgba(0,20,10,0.3)';ctx.fillRect(0,200,canvas.width,180);for(let i=0;i<stars.length;i++){let s=stars[i];let alpha=0.5+Math.sin(Date.now()/250+i*1.2)*0.5;ctx.globalAlpha=Math.max(0.3,alpha);let sz=(i%4===0)?2.5:1.5;ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,sz,sz);}ctx.globalAlpha=1;invaders.forEach(inv=>{if(!inv.alive)return;let bob=Math.sin(Date.now()/180+inv.x/20)*1.5;let y=inv.y+bob;ctx.shadowBlur=5;ctx.shadowColor='#0f0';ctx.fillStyle='#0f0';ctx.fillRect(inv.x+2,y+2,inv.w-4,inv.h-4);ctx.fillRect(inv.x+6,y,inv.w-12,4);ctx.fillRect(inv.x+4,y+inv.h-4,inv.w-8,4);ctx.fillStyle='#000';ctx.fillRect(inv.x+7,y+6,4,4);ctx.fillRect(inv.x+inv.w-11,y+6,4,4);let leg=Math.floor(Date.now()/400)%2===0?0:2;ctx.fillRect(inv.x+3,y+inv.h-2,3,3+leg);ctx.fillRect(inv.x+inv.w-6,y+inv.h-2,3,3+leg);ctx.shadowBlur=0;});ctx.shadowBlur=8;ctx.shadowColor='#0f0';ctx.fillStyle='#0f0';ctx.fillRect(player.x+6,player.y+4,player.w-12,player.h-6);ctx.fillRect(player.x,player.y+8,8,8);ctx.fillRect(player.x+player.w-8,player.y+8,8,8);ctx.fillRect(player.x+player.w/2-3,player.y,6,8);ctx.fillStyle='#a0f0a0';ctx.fillRect(player.x+player.w/2-4,player.y+6,8,6);ctx.shadowBlur=0;if(Math.abs(joyX)>0.05){ctx.fillStyle='#ffaa00';ctx.fillRect(player.x+player.w/2-2,player.y+player.h-2,4,5);ctx.fillStyle='#ffff00';ctx.fillRect(player.x+player.w/2-1,player.y+player.h-1,2,3);}playerBullets.forEach(b=>{ctx.shadowBlur=12;ctx.shadowColor='#0f0';ctx.fillStyle='#0f0';ctx.fillRect(b.x,b.y,b.w,b.h+3);ctx.shadowBlur=0;});enemyBullets.forEach(b=>{ctx.shadowBlur=6;ctx.shadowColor='#f33';ctx.fillStyle='#f33';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0;});particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/25);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;if(paused){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#0f0';ctx.shadowBlur=10;ctx.shadowColor='#0f0';ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.fillText('PAUSED',canvas.width/2,canvas.height/2);ctx.shadowBlur=0;}if(gameOver){ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#f33';ctx.shadowBlur=8;ctx.shadowColor='#f33';ctx.font='bold 26px monospace';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-30);ctx.shadowBlur=0;ctx.fillStyle='#0f0';ctx.font='16px monospace';ctx.fillText('SCORE: '+score,canvas.width/2,canvas.height/2+5);ctx.fillText('Tap screen to restart',canvas.width/2,canvas.height/2+35);}}function gameLoop(){if(gameStarted&&!paused&&!gameOver){update();}draw();updateUI();requestAnimationFrame(gameLoop);}function updateJoy(e){const rect=joyContainer.getBoundingClientRect();const cx=rect.left+rect.width/2;const cy=rect.top+rect.height/2;let dx=e.clientX-cx;let dy=e.clientY-cy;const max=rect.width/2-18;const dist=Math.sqrt(dx*dx+dy*dy);if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}joyX=dx/max;joyKnob.style.left=`calc(50% + ${dx}px)`;joyKnob.style.top=`calc(50% + ${dy}px)`;joyKnob.style.transform='translate(-50%,-50%)';}function endJoy(){joyX=0;joyKnob.style.left='50%';joyKnob.style.top='50%';joyKnob.style.transform='translate(-50%,-50%)';activePointer=null;}joyContainer.addEventListener('pointerdown',e=>{e.preventDefault();activePointer=e.pointerId;joyContainer.setPointerCapture(e.pointerId);updateJoy(e);});joyContainer.addEventListener('pointermove',e=>{if(activePointer===e.pointerId)updateJoy(e);});joyContainer.addEventListener('pointerup',endJoy);joyContainer.addEventListener('pointercancel',endJoy);fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(gameStarted&&!paused&&!gameOver)fire();});pauseBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(!gameStarted)return;paused=!paused;pauseBtn.textContent=paused?'RESUME':'PAUSE';});speedSlider.addEventListener('input',()=>{gameSpeed=parseFloat(speedSlider.value);speedVal.textContent=gameSpeed.toFixed(1);});canvas.addEventListener('click',()=>{if(gameOver){resetGame();}});startBtn.addEventListener('click',()=>{overlay.style.display='none';resetGame();});initStars();initInvaders();speedSlider.value=gameSpeed;speedVal.textContent=gameSpeed.toFixed(1);updateUI();gameLoop();</script></body></html>
