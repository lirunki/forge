<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop Light</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a10; color: #e0e0ff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  .container { max-width: 620px; margin: 0 auto; padding: 8px 12px; display: flex; flex-direction: column; height: 100vh; }
  header { text-align: center; padding: 6px 0 4px; }
  h1 { margin: 0; font-size: 1.55rem; letter-spacing: 2px; font-weight: 600; }
  .subtitle { font-size: 0.72rem; opacity: 0.55; margin-top: 1px; }
  .canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 6px 0; min-height: 0; }
  canvas { border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); background: #111; touch-action: none; max-width: 100%; }
  .controls { padding: 8px 0 4px; }
  .btn-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
  button { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #e0e0ff; padding: 9px 15px; border-radius: 9999px; font-size: 0.85rem; cursor: pointer; transition: all 0.1s ease; user-select: none; }
  button:active { background: rgba(255,255,255,0.18); transform: scale(0.97); }
  .layer-list { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .layer-pill { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 700; color: #111; box-shadow: 0 2px 8px rgba(0,0,0,0.35); cursor: pointer; border: 3px solid transparent; transition: transform 0.1s, border 0.1s; }
  .layer-pill.selected { border-color: #fff; transform: scale(1.12); }
  .layer-pill.locked { border-color: #f59e0b; }
  .layer-controls { display: flex; gap: 5px; justify-content: center; }
  .layer-controls button { padding: 7px 13px; font-size: 1.05rem; }
  .info { text-align: center; font-size: 0.65rem; opacity: 0.45; margin-top: 6px; line-height: 1.3; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Loop Light</h1>
    <div class="subtitle">Visual instrument • Perfect geometry</div>
  </header>
  <div class="canvas-wrap">
    <canvas id="canvas" width="500" height="500"></canvas>
  </div>
  <div class="controls">
    <div class="btn-row">
      <button onclick="addLayer()">+ Add Layer</button>
      <button id="auto-btn" onclick="toggleAuto()">Auto</button>
      <button onclick="resetLayers()">Reset</button>
      <button onclick="chimeAll()">Chime</button>
    </div>
    <div id="layer-list" class="layer-list"></div>
    <div class="layer-controls">
      <button onclick="rotateSelected(-0.28)">⟲</button>
      <button onclick="rotateSelected(0.28)">⟳</button>
      <button onclick="toggleLock()">Lock</button>
      <button onclick="removeLayer()">Remove</button>
    </div>
  </div>
  <div class="info">Drag near a shape to rotate • Release to coast with momentum • Locked layers move together</div>
</div>
<script>
let canvas, ctx, layers = [], selectedIndex = -1, isAuto = false, lastTime = 0, dragging = false, prevTouchAngle = 0, lastDragTime = 0, audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

function playBell(freq, vol = 0.22) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') { audioCtx.resume().catch(()=>{}); }
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2.01;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = freq * 2.8;
  const gain = audioCtx.createGain();
  const gain2 = audioCtx.createGain();
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(vol, now + 0.018);
  gain.gain.linearRampToValueAtTime(0.0008, now + 1.7);
  gain2.gain.value = vol * 0.35;
  gain2.gain.linearRampToValueAtTime(0.0005, now + 1.1);
  osc.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  gain2.connect(audioCtx.destination);
  osc.start(now);
  osc2.start(now);
  osc.stop(now + 2.2);
  osc2.stop(now + 2.2);
}

function getLayerIndex(x, y) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
  let closest = -1;
  let minDiff = 38;
  layers.forEach((layer, i) => {
    const d = Math.abs(dist - layer.radius);
    if (d < minDiff) {
      minDiff = d;
      closest = i;
    }
  });
  return closest;
}

function applyRotation(idx, delta) {
  if (idx < 0 || idx >= layers.length) return;
  const layer = layers[idx];
  if (layer.locked) {
    layers.forEach(l => {
      if (l.locked) {
        const step = 2 * Math.PI / l.numPoints;
        const old = l.angle;
        l.angle += delta;
        if (Math.floor(old / step) !== Math.floor(l.angle / step)) {
          playBell(l.freq, 0.2);
        }
      }
    });
  } else {
    const step = 2 * Math.PI / layer.numPoints;
    const old = layer.angle;
    layer.angle += delta;
    if (Math.floor(old / step) !== Math.floor(layer.angle / step)) {
      playBell(layer.freq, 0.2);
    }
  }
}

function draw() {
  if (!ctx) return;
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  ctx.fillStyle = '#0a0a10';
  ctx.fillRect(0, 0, w, h);
  const glow = ctx.createRadialGradient(cx, cy, 6, cx, cy, Math.max(w, h) / 2.3);
  glow.addColorStop(0, 'rgba(130, 150, 230, 0.05)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
  layers.forEach((layer, i) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(layer.angle);
    const step = (Math.PI * 2) / layer.numPoints;
    ctx.strokeStyle = layer.color;
    ctx.lineWidth = 0.8;
    ctx.setLineDash([3, 7]);
    ctx.beginPath();
    ctx.arc(0, 0, layer.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = layer.color;
    ctx.lineWidth = (i === selectedIndex) ? 3.5 : 2.1;
    ctx.beginPath();
    for (let p = 0; p < layer.numPoints; p++) {
      const a = p * step;
      const x = Math.cos(a) * layer.radius;
      const y = Math.sin(a) * layer.radius;
      if (p === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.strokeStyle = layer.color;
    ctx.lineWidth = 0.8;
    for (let p = 0; p < layer.numPoints; p++) {
      const a = p * step;
      const x = Math.cos(a) * layer.radius * 0.82;
      const y = Math.sin(a) * layer.radius * 0.82;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
    ctx.fillStyle = layer.color;
    for (let p = 0; p < layer.numPoints; p++) {
      const a = p * step;
      const x = Math.cos(a) * layer.radius;
      const y = Math.sin(a) * layer.radius;
      ctx.beginPath();
      ctx.arc(x, y, 5.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(x, y, 2.0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = layer.color;
    }
    if (layer.numPoints > 5) {
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      const innerR = layer.radius * 0.52;
      for (let p = 0; p < layer.numPoints; p++) {
        const a = p * step + step / 2;
        const x = Math.cos(a) * innerR;
        const y = Math.sin(a) * innerR;
        if (p === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  });
  ctx.fillStyle = '#b8c4ff';
  ctx.beginPath();
  ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
  ctx.fill();
}

function updateLayerUI() {
  const container = document.getElementById('layer-list');
  container.innerHTML = '';
  layers.forEach((layer, i) => {
    const el = document.createElement('div');
    el.className = `layer-pill ${i === selectedIndex ? 'selected' : ''} ${layer.locked ? 'locked' : ''}`;
    el.style.backgroundColor = layer.color;
    el.innerHTML = `<span style="font-size:0.58rem;font-weight:700">L${i+1}</span>`;
    if (layer.locked) el.innerHTML += ' <span style="font-size:9px">🔒</span>';
    el.onclick = () => {
      selectedIndex = i;
      updateLayerUI();
      draw();
    };
    container.appendChild(el);
  });
}

function addLayer() {
  if (layers.length >= 6) return;
  const i = layers.length;
  const radius = 52 + i * 37;
  const numPointsArr = [5, 6, 8, 9, 12, 15];
  const hues = [195, 215, 255, 285, 315, 335];
  const freqs = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
  layers.push({
    radius: radius,
    numPoints: numPointsArr[i],
    angle: (i * 0.6) % (Math.PI * 2),
    speed: 0.038 + (i % 3) * 0.028,
    color: `hsl(${hues[i]}, 68%, 74%)`,
    locked: false,
    freq: freqs[i % freqs.length],
    velocity: 0
  });
  selectedIndex = layers.length - 1;
  updateLayerUI();
  draw();
}

function rotateSelected(delta) {
  if (selectedIndex >= 0) {
    applyRotation(selectedIndex, delta);
    draw();
  }
}

function toggleLock() {
  if (selectedIndex < 0 || selectedIndex >= layers.length) return;
  layers[selectedIndex].locked = !layers[selectedIndex].locked;
  updateLayerUI();
  draw();
}

function removeLayer() {
  if (selectedIndex < 0 || layers.length <= 1) return;
  layers.splice(selectedIndex, 1);
  if (selectedIndex >= layers.length) selectedIndex = layers.length - 1;
  updateLayerUI();
  draw();
}

function toggleAuto() {
  isAuto = !isAuto;
  const btn = document.getElementById('auto-btn');
  btn.textContent = isAuto ? 'Pause' : 'Auto';
  if (isAuto) {
    layers.forEach(l => l.velocity = 0);
    initAudio();
  }
}

function chimeAll() {
  layers.forEach((l, i) => {
    setTimeout(() => playBell(l.freq, 0.18), i * 70);
  });
}

function resetLayers() {
  layers = [];
  addLayer();
  addLayer();
  addLayer();
  selectedIndex = 0;
  isAuto = false;
  document.getElementById('auto-btn').textContent = 'Auto';
  updateLayerUI();
  draw();
}

function setupEvents() {
  const handleStart = (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    let cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    let cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    const idx = getLayerIndex(cx, cy);
    if (idx !== -1) {
      selectedIndex = idx;
      updateLayerUI();
      dragging = true;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      prevTouchAngle = Math.atan2(cy - centerY, cx - centerX);
      lastDragTime = Date.now();
      const isLocked = layers[idx].locked;
      layers.forEach(l => {
        if ((isLocked && l.locked) || (!isLocked && l === layers[idx])) {
          l.velocity = 0;
        }
      });
    }
  };
  const handleMove = (e) => {
    if (!dragging) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    let cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    let cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const curr = Math.atan2(cy - centerY, cx - centerX);
    let delta = curr - prevTouchAngle;
    if (delta > Math.PI) delta -= 2 * Math.PI;
    if (delta < -Math.PI) delta += 2 * Math.PI;
    prevTouchAngle = curr;
    applyRotation(selectedIndex, delta);
    const now = Date.now();
    const dt = Math.max((now - lastDragTime) / 1000, 0.001);
    const vel = delta / dt;
    const isLocked = layers[selectedIndex].locked;
    layers.forEach(l => {
      if ((isLocked && l.locked) || (!isLocked && l === layers[selectedIndex])) {
        l.velocity = vel;
      }
    });
    lastDragTime = now;
    draw();
  };
  const handleEnd = (e) => { dragging = false; };
  canvas.addEventListener('mousedown', handleStart);
  canvas.addEventListener('mousemove', handleMove);
  canvas.addEventListener('mouseup', handleEnd);
  canvas.addEventListener('mouseleave', handleEnd);
  canvas.addEventListener('touchstart', handleStart, { passive: false });
  canvas.addEventListener('touchmove', handleMove, { passive: false });
  canvas.addEventListener('touchend', handleEnd);
}

function animateAndDraw() {
  const now = Date.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.18) dt = 0.18;
  if (isAuto) {
    layers.forEach(layer => {
      if (!layer.locked) {
        const step = 2 * Math.PI / layer.numPoints;
        const old = layer.angle;
        layer.angle += layer.speed * dt;
        if (Math.floor(old / step) !== Math.floor(layer.angle / step)) {
          playBell(layer.freq, 0.16);
        }
      }
    });
    const locked = layers.filter(l => l.locked);
    if (locked.length > 0) {
      const gSpeed = locked[0].speed;
      locked.forEach(layer => {
        const step = 2 * Math.PI / layer.numPoints;
        const old = layer.angle;
        layer.angle += gSpeed * dt;
        if (Math.floor(old / step) !== Math.floor(layer.angle / step)) {
          playBell(layer.freq, 0.16);
        }
      });
    }
  }
  if (!isAuto && !dragging) {
    layers.forEach(layer => {
      if (layer.velocity && Math.abs(layer.velocity) > 0.001) {
        const step = 2 * Math.PI / layer.numPoints;
        const old = layer.angle;
        layer.angle += layer.velocity * dt;
        layer.velocity *= Math.pow(0.965, dt * 60);
        if (Math.abs(layer.velocity) < 0.001) layer.velocity = 0;
        if (Math.floor(old / step) !== Math.floor(layer.angle / step)) {
          playBell(layer.freq, 0.16);
        }
      }
    });
  }
  draw();
  requestAnimationFrame(animateAndDraw);
}

function init() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  function setSize() {
    const size = Math.min(window.innerWidth * 0.92, 520);
    canvas.width = size;
    canvas.height = size;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
  }
  setSize();
  window.addEventListener('resize', () => { setSize(); draw(); });
  layers = [];
  addLayer();
  addLayer();
  addLayer();
  selectedIndex = 0;
  updateLayerUI();
  lastTime = Date.now();
  setupEvents();
  draw();
  requestAnimationFrame(animateAndDraw);
}
window.onload = init;
</script>
</body>
</html>
