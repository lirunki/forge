<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Boids Flock</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none}#canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;z-index:0}#panel{position:fixed;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(180deg,rgba(10,14,26,0) 0%,rgba(10,14,26,0.85) 12%,rgba(10,14,26,0.97) 40%);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 16px 20px;padding-bottom:max(20px,env(safe-area-inset-bottom));transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}#panel.collapsed{transform:translateY(calc(100% - 52px))}#panel-handle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer}#panel-handle .grip{width:40px;height:4px;background:rgba(255,255,255,0.25);border-radius:2px;margin:0 auto 8px}#panel-title{font-size:15px;font-weight:700;color:#e8ecf5;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}#panel-title .dot{width:8px;height:8px;border-radius:50%;background:#4fc3f7;box-shadow:0 0 8px #4fc3f7;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}#panel-toggle{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#a0aec0;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all 0.2s}#panel-toggle:active{background:rgba(255,255,255,0.15)}#controls{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;max-width:560px;margin:0 auto}.slider-group{display:flex;flex-direction:column;gap:4px}.slider-group.full{grid-column:1/-1}.slider-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:#8b9bb4;text-transform:uppercase;letter-spacing:0.6px}.slider-label .value{color:#4fc3f7;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}input[type=range]::-webkit-slider-runnable-track{height:5px;background:rgba(255,255,255,0.1);border-radius:3px}input[type=range]::-moz-range-track{height:5px;background:rgba(255,255,255,0.1);border-radius:3px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#4fc3f7;margin-top:-8px;box-shadow:0 0 10px rgba(79,195,247,0.5);border:2px solid #0a0e1a;transition:transform 0.15s}input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#4fc3f7;box-shadow:0 0 10px rgba(79,195,247,0.5);border:2px solid #0a0e1a}input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}#hint{position:fixed;top:0;left:0;right:0;z-index:5;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;justify-content:center;pointer-events:none}#hint .badge{background:rgba(10,14,26,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08);color:#7a8ba3;font-size:11px;font-weight:500;padding:6px 14px;border-radius:20px;letter-spacing:0.3px;opacity:0;transition:opacity 0.5s}#hint .badge.show{opacity:1}.btn-row{display:flex;gap:8px;grid-column:1/-1;margin-top:2px}.btn{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#c0cee0;font-size:12px;font-weight:600;padding:9px 0;border-radius:10px;cursor:pointer;transition:all 0.2s;text-align:center}.btn:active{background:rgba(79,195,247,0.15);border-color:rgba(79,195,247,0.3)}.btn.active{background:rgba(79,195,247,0.2);border-color:rgba(79,195,247,0.4);color:#4fc3f7}</style></head><body><canvas id="canvas"></canvas><div id="hint"><div class="badge" id="hintBadge">Touch &amp; drag to scatter the flock</div></div><div id="panel"><div id="panel-handle"><div id="panel-title"><span class="dot"></span>Boids Flock</div><button id="panel-toggle">Collapse</button></div><div id="controls"><div class="slider-group"><div class="slider-label">Separation <span class="value" id="sepVal">1.5</span></div><input type="range" id="sepSlider" min="0" max="4" step="0.05" value="1.5"></div><div class="slider-group"><div class="slider-label">Alignment <span class="value" id="aliVal">1.0</span></div><input type="range" id="aliSlider" min="0" max="4" step="0.05" value="1.0"></div><div class="slider-group"><div class="slider-label">Cohesion <span class="value" id="cohVal">1.0</span></div><input type="range" id="cohSlider" min="0" max="4" step="0.05" value="1.0"></div><div class="slider-group"><div class="slider-label">Cursor Avoid <span class="value" id="curVal">2.5</span></div><input type="range" id="curSlider" min="0" max="6" step="0.1" value="2.5"></div><div class="slider-group"><div class="slider-label">Population <span class="value" id="popVal">150</span></div><input type="range" id="popSlider" min="10" max="500" step="5" value="150"></div><div class="slider-group"><div class="slider-label">Max Speed <span class="value" id="spdVal">3.0</span></div><input type="range" id="spdSlider" min="0.5" max="8" step="0.1" value="3.0"></div><div class="btn-row"><div class="btn" id="trailBtn">Trails: On</div><div class="btn" id="resetBtn">Reset</div></div></div></div><script>(function(){'use strict';const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');let W=0,H=0,DPR=1;function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}resize();window.addEventListener('resize',resize);const params={sep:1.5,ali:1.0,coh:1.0,cursor:2.5,pop:150,speed:3.0,trails:true};const PERCEPTION=50;const SEPARATION_DIST=28;const CURSOR_RADIUS=120;let mouse={x:-9999,y:-9999,active:false};class Boid{constructor(x,y){this.x=x||Math.random()*W;this.y=y||Math.random()*H;const a=Math.random()*Math.PI*2;this.vx=Math.cos(a)*2;this.vy=Math.sin(a)*2;this.ax=0;this.ay=0;this.hue=180+Math.random()*80}flock(boids){let sepX=0,sepY=0,sepCount=0;let aliX=0,aliY=0,aliCount=0;let cohX=0,cohY=0,cohCount=0;for(let i=0;i<boids.length;i++){const other=boids[i];if(other===this)continue;const dx=this.x-other.x;const dy=this.y-other.y;const d2=dx*dx+dy*dy;if(d2>PERCEPTION*PERCEPTION)continue;const d=Math.sqrt(d2)||0.001;aliX+=other.vx;aliY+=other.vy;aliCount++;cohX+=other.x;cohY+=other.y;cohCount++;if(d2<SEPARATION_DIST*SEPARATION_DIST&&d>0){sepX+=dx/d;sepY+=dy/d;sepCount++}}this.ax=0;this.ay=0;if(sepCount>0){sepX/=sepCount;sepY/=sepCount;this.ax+=sepX*params.sep;this.ay+=sepY*params.sep}if(aliCount>0){aliX/=aliCount;aliY/=aliCount;this.ax+=(aliX-this.vx)*params.ali*0.05;this.ay+=(aliY-this.vy)*params.ali*0.05}if(cohCount>0){cohX/=cohCount;cohY/=cohCount;const dx=cohX-this.x;const dy=cohY-this.y;this.ax+=dx*params.coh*0.0015;this.ay+=dy*params.coh*0.0015}if(mouse.active){const dx=this.x-mouse.x;const dy=this.y-mouse.y;const d2=dx*dx+dy*dy;if(d2<CURSOR_RADIUS*CURSOR_RADIUS){const d=Math.sqrt(d2)||0.001;const force=(1-d/CURSOR_RADIUS)*params.cursor;this.ax+=(dx/d)*force;this.ay+=(dy/d)*force}}}update(){this.vx+=this.ax;this.vy+=this.ay;const sp=Math.sqrt(this.vx*this.vx+this.vy*this.vy);const maxSp=params.speed;if(sp>maxSp){this.vx=(this.vx/sp)*maxSp;this.vy=(this.vy/sp)*maxSp}else if(sp<0.5&&sp>=0){this.vx=(this.vx/(sp||1))*0.5;this.vy=(this.vy/(sp||1))*0.5}this.x+=this.vx;this.y+=this.vy;const margin=30;if(this.x<-margin)this.x=W+margin;if(this.x>W+margin)this.x=-margin;if(this.y<-margin)this.y=H+margin;if(this.y>H+margin)this.y=-margin}draw(){const angle=Math.atan2(this.vy,this.vx);const sp=Math.sqrt(this.vx*this.vx+this.vy*this.vy);const intensity=Math.min(sp/params.speed,1);const hue=this.hue;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-5,-4);ctx.lineTo(-3,0);ctx.lineTo(-5,4);ctx.closePath();const grad=ctx.createLinearGradient(-5,0,7,0);grad.addColorStop(0,'hsla('+hue+',70%,'+(30+intensity*30)+'%,0.85)');grad.addColorStop(1,'hsla('+(hue+20)+',85%,'+(50+intensity*30)+'%,0.95)');ctx.fillStyle=grad;ctx.fill();ctx.restore()}}let boids=[];function initBoids(count){boids=[];for(let i=0;i<count;i++){boids.push(new Boid())}}function adjustPopulation(target){while(boids.length<target)boids.push(new Boid());if(boids.length>target)boids.length=target}initBoids(params.pop);function animate(){if(params.trails){ctx.fillStyle='rgba(10,14,26,0.15)';ctx.fillRect(0,0,W,H)}else{ctx.clearRect(0,0,W,H)}if(mouse.active){const grad=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,CURSOR_RADIUS);grad.addColorStop(0,'rgba(255,80,80,0.12)');grad.addColorStop(0.6,'rgba(255,80,80,0.04)');grad.addColorStop(1,'rgba(255,80,80,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(mouse.x,mouse.y,CURSOR_RADIUS,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,100,100,0.15)';ctx.lineWidth=1;ctx.stroke()}for(let i=0;i<boids.length;i++)boids[i].flock(boids);for(let i=0;i<boids.length;i++){boids[i].update();boids[i].draw()}requestAnimationFrame(animate)}animate();function setupSlider(id,valId,key,formatter){const slider=document.getElementById(id);const valEl=document.getElementById(valId);slider.addEventListener('input',function(){params[key]=parseFloat(slider.value);valEl.textContent=formatter?formatter(slider.value):parseFloat(slider.value).toFixed(key==='pop'?0:1);if(key==='pop')adjustPopulation(parseInt(slider.value))})}setupSlider('sepSlider','sepVal','sep');setupSlider('aliSlider','aliVal','ali');setupSlider('cohSlider','cohVal','coh');setupSlider('curSlider','curVal','cur');setupSlider('popSlider','popVal','pop',function(v){return parseInt(v)});setupSlider('spdSlider','spdVal','spd');const trailBtn=document.getElementById('trailBtn');trailBtn.addEventListener('click',function(){params.trails=!params.trails;trailBtn.textContent='Trails: '+(params.trails?'On':'Off');trailBtn.classList.toggle('active',params.trails)});trailBtn.classList.add('active');document.getElementById('resetBtn').addEventListener('click',function(){initBoids(params.pop)});const panel=document.getElementById('panel');const panelToggle=document.getElementById('panel-toggle');const panelHandle=document.getElementById('panel-handle');function togglePanel(){panel.classList.toggle('collapsed');panelToggle.textContent=panel.classList.contains('collapsed')?'Expand':'Collapse'}panelToggle.addEventListener('click',function(e){e.stopPropagation();togglePanel()});panelHandle.addEventListener('click',function(e){if(e.target===panelToggle)return;togglePanel()});function handlePointer(x,y){mouse.x=x;mouse.y=y;mouse.active=true}canvas.addEventListener('touchstart',function(e){e.preventDefault();const t=e.touches[0];handlePointer(t.clientX,t.clientY)},{passive:false});canvas.addEventListener('touchmove',function(e){e.preventDefault();const t=e.touches[0];handlePointer(t.clientX,t.clientY)},{passive:false});canvas.addEventListener('touchend',function(){mouse.active=false;mouse.x=-9999;mouse.y=-9999});canvas.addEventListener('mousedown',function(e){handlePointer(e.clientX,e.clientY)});canvas.addEventListener('mousemove',function(e){if(mouse.active||e.buttons>0)handlePointer(e.clientX,e.clientY)});canvas.addEventListener('mouseup',function(){mouse.active=false;mouse.x=-9999;mouse.y=-9999});canvas.addEventListener('mouseleave',function(){mouse.active=false;mouse.x=-9999;mouse.y=-9999});const hintBadge=document.getElementById('hintBadge');setTimeout(function(){hintBadge.classList.add('show')},800);setTimeout(function(){hintBadge.classList.remove('show')},5000)})();</script></body></html>
