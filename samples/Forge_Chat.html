<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Chat</title>
<style>
:root { --bg:#0f172a; --surface:#1e2937; --accent:#6366f1; --text:#e2e8f0; --muted:#94a3b8; }
body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#1e2937; border-bottom:1px solid #334155; }
.title { font-size:20px; font-weight:600; }
.subtitle { font-size:12px; color:var(--muted); }
.icon-btn { width:36px; height:36px; border-radius:9999px; background:#334155; border:none; color:#e2e8f0; font-size:16px; display:flex; align-items:center; justify-content:center; }
.status { padding:4px 16px; font-size:12px; color:var(--muted); min-height:20px; }
.messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px; height:calc(100vh - 200px); }
.bubble { max-width:85%; padding:12px 16px; border-radius:18px; }
.user { align-self:flex-end; background:var(--accent); color:white; }
.assistant { align-self:flex-start; background:var(--surface); }
.attach-strip { display:flex; gap:8px; overflow-x:auto; padding:8px 16px; }
.chip { background:#334155; border-radius:9999px; padding:4px 10px; font-size:12px; display:flex; align-items:center; gap:6px; }
.composer { position:fixed; bottom:0; left:0; right:0; background:#1e2937; padding:12px 16px; border-top:1px solid #334155; }
.row { display:flex; gap:8px; align-items:flex-end; }
textarea { flex:1; background:#0f172a; border:1px solid #475569; color:#e2e8f0; border-radius:20px; padding:12px 16px; font-size:16px; resize:none; min-height:44px; }
button { background:var(--accent); color:white; border:none; border-radius:9999px; padding:0 20px; height:44px; font-weight:600; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:flex-end; }
.sheet { background:#1e2937; width:100%; border-radius:20px 20px 0 0; padding:20px; max-height:80vh; overflow:auto; }
select, input, textarea { background:#0f172a; color:#e2e8f0; border:1px solid #475569; border-radius:8px; padding:8px; width:100%; }
.iframe-wrap { border:1px solid #475569; border-radius:12px; overflow:hidden; background:#0f172a; }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="title">Forge Chat</div>
    <div id="subtitle" class="subtitle">Ready</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
    <button class="icon-btn" onclick="newChat()">✨</button>
  </div>
</div>
<div id="status" class="status">Ready</div>
<div id="messages" class="messages"></div>
<div class="composer">
  <div id="attach-strip" class="attach-strip" style="display:none"></div>
  <div class="row">
    <textarea id="input" placeholder="Message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    <button onclick="showAttach()">📎</button>
    <button onclick="send()" id="send-btn">➤</button>
  </div>
</div>

<div id="attach-modal" class="modal" onclick="if(event.target.id==='attach-modal')hideAttach()">
  <div class="sheet">
    <h3>Attach</h3>
    <button onclick="takePhoto()" style="margin:8px 0;width:100%">📷 Take photo</button>
    <button onclick="pickGallery()" style="margin:8px 0;width:100%">🖼️ Camera roll</button>
    <button onclick="pickFiles()" style="margin:8px 0;width:100%">📄 Files (PDF/audio/images)</button>
    <button onclick="hideAttach()" style="margin-top:12px;width:100%;background:#475569">Cancel</button>
  </div>
</div>

<div id="settings-modal" class="modal" onclick="if(event.target.id==='settings-modal')hideSettings()">
  <div class="sheet">
    <h3>Settings</h3>
    <div style="margin:12px 0">
      <label>AI Provider</label>
      <select id="provider-select"></select>
    </div>
    <div style="margin:12px 0">
      <label>System Prompt</label>
      <textarea id="sys-prompt" rows="3"></textarea>
    </div>
    <div style="margin:12px 0">
      <label>HTML Scale <span id="scale-val">100%</span></label>
      <input type="range" id="html-scale" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div style="margin:12px 0"><label><input type="checkbox" id="inline-img"> Inline remote images</label></div>
    <div style="margin:12px 0"><label><input type="checkbox" id="prefer-html"> Prefer HTML replies</label></div>
    <div style="margin:12px 0"><label><input type="checkbox" id="enable-tools"> Enable host tools (web, GPS, SMS, apps…)</label></div>
    <div style="margin:12px 0"><label><input type="checkbox" id="confirm-launch"> Confirm before side effects (launch/send/call)</label></div>
    <div style="margin:12px 0"><label><input type="checkbox" id="allow-danger"> Allow dangerous tools (sms_send, phone_call)</label></div>
    <div style="margin:12px 0">
      <label>Max tool rounds</label>
      <input type="range" id="max-rounds" min="1" max="12" step="1" value="8">
    </div>
    <div style="display:flex;gap:12px;margin-top:20px">
      <button onclick="saveSettings()" style="flex:1">Save</button>
      <button onclick="hideSettings()" style="flex:1;background:#475569">Cancel</button>
    </div>
  </div>
</div>

<script>
let messages = [];
let pendingAttachments = [];
let settings = { providerId: null, htmlScale: 1.0, inlineImages: true, preferHtml: true, enableTools: true, confirmLaunch: true, allowDangerousTools: false, maxToolRounds: 8, systemPrompt: '', temperature: 0.7 };
let APP_TOOLS = []; // filled from ForgeHost.tools.list
let TOOL_META = {}; // name -> { risk, group }

async function refreshHostTools() {
  APP_TOOLS = [];
  TOOL_META = {};
  window.__forgeToolsHint = '';
  if (!settings.enableTools) return;
  try {
    const riskMax = settings.allowDangerousTools ? 'danger' : 'confirm';
    const r = await ForgeHost.tools.list({ riskMax: riskMax });
    APP_TOOLS = Array.isArray(r.tools) ? r.tools : [];
    (r.catalog || []).forEach(function (c) {
      TOOL_META[c.name] = c;
    });
    try {
      const hr = await ForgeHost.tools.hint({ riskMax: settings.allowDangerousTools ? 'danger' : 'confirm' });
      window.__forgeToolsHint = (hr && hr.hint) || '';
    } catch (_) {}
    // Fallback if host too old
    if (!APP_TOOLS.length && ForgeHost.apps) {
      APP_TOOLS = [{
        type: 'function',
        function: {
          name: 'list_apps',
          description: 'Search installed apps',
          parameters: { type: 'object', properties: { query: { type: 'string' }, limit: { type: 'number' } } }
        }
      }];
    }
  } catch (e) {
    try { console.warn('[Forge Chat] tools.list failed', e && e.message ? e.message : e); } catch (_) {}
  }
}

async function init() {
  const saved = await ForgeHost.storage.get('forgechat_settings');
  if (saved) settings = {...settings, ...saved};
  await refreshProviders();
  await refreshHostTools();
  renderMessages();
  document.getElementById('html-scale').oninput = () => { document.getElementById('scale-val').textContent = Math.round(document.getElementById('html-scale').value*100)+'%'; };
}

async function refreshProviders() {
  try {
    const menu = await ForgeHost.ai.listProviders();
    const sel = document.getElementById('provider-select');
    sel.innerHTML = '';
    (menu.providers || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.label || p.id;
      sel.appendChild(opt);
    });
    if (settings.providerId) sel.value = settings.providerId;
    updateSubtitle();
  } catch(e) { setStatus('Provider error'); }
}

function updateSubtitle() {
  const sub = document.getElementById('subtitle');
  sub.textContent = settings.providerId ? settings.providerId : 'Ready';
}

function setStatus(t) { document.getElementById('status').textContent = t; }

function renderMessages() {
  const c = document.getElementById('messages');
  c.innerHTML = '';
  messages.forEach(m => {
    const b = document.createElement('div');
    b.className = 'bubble ' + (m.role === 'user' ? 'user' : 'assistant');
    if (m.attachments && m.attachments.length) {
      const strip = document.createElement('div');
      strip.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap';
      m.attachments.forEach(a => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = a.name || 'file';
        strip.appendChild(chip);
      });
      b.appendChild(strip);
    }
    if (m.kind === 'html') {
      const wrap = document.createElement('div');
      wrap.className = 'iframe-wrap';
      wrap.style.transform = `scale(${settings.htmlScale})`;
      wrap.style.transformOrigin = 'top left';
      wrap.style.width = `${100/settings.htmlScale}%`;
      const ifr = document.createElement('iframe');
      ifr.style.cssText = 'width:100%;height:280px;border:0';
      ifr.sandbox = 'allow-scripts allow-forms allow-modals';
      ifr.srcdoc = m.html;
      wrap.appendChild(ifr);
      b.appendChild(wrap);
    } else {
      const p = document.createElement('div');
      p.style.whiteSpace = 'pre-wrap';
      p.textContent = m.content || '';
      b.appendChild(p);
    }
    c.appendChild(b);
  });
  c.scrollTop = c.scrollHeight;
}

function showAttach() { document.getElementById('attach-modal').style.display = 'flex'; }
function hideAttach() { document.getElementById('attach-modal').style.display = 'none'; }

/** Normalize camera / gallery / files.pick into a stable attachment. */
function normalizeMedia(raw, fallbackName) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.cancelled) return null;
  let item = raw;
  if (Array.isArray(raw)) item = raw[0];
  if (raw.files && Array.isArray(raw.files)) item = raw.files[0];
  if (!item || item.cancelled) return null;

  let mime = String(item.mime || item.type || item.contentType || '').toLowerCase();
  let dataUrl = item.rawDataUrl || item.dataUrl || item.dataURL || '';
  let base64 = typeof item.base64 === 'string' ? item.base64.replace(/\s+/g, '') : '';
  let name = item.name || fallbackName || 'file';
  const format = String(item.format || '').toLowerCase();

  if (dataUrl && /^blob:/i.test(dataUrl)) dataUrl = '';
  if (!base64 && dataUrl && /base64,/i.test(dataUrl)) {
    base64 = String(dataUrl.split(/base64,/i).pop() || '').replace(/\s+/g, '');
  }
  if ((!mime || mime === 'application/octet-stream') && (item.width || item.height || format === 'jpeg' || (base64 && base64.indexOf('/9j/') === 0))) {
    mime = 'image/jpeg';
  }
  if ((!mime || mime === 'application/octet-stream') && /^data:image\//i.test(dataUrl)) {
    mime = (dataUrl.slice(5).split(';')[0] || 'image/jpeg').toLowerCase();
  }
  if (!mime) mime = 'application/octet-stream';
  if (!dataUrl && base64) dataUrl = 'data:' + mime + ';base64,' + base64;

  if (!base64 && !dataUrl && !item.uri && !item.path) return null;

  let previewUrl = item.previewUrl || item.blobUrl || item.displayUrl || '';
  if (!previewUrl && base64 && /^image\//i.test(mime)) {
    try {
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      previewUrl = URL.createObjectURL(new Blob([bytes], { type: mime }));
    } catch (_) { previewUrl = ''; }
  }
  if (!previewUrl && dataUrl && /^data:image\//i.test(dataUrl)) previewUrl = dataUrl;

  return {
    type: /^image\//i.test(mime) ? 'image' : 'file',
    name,
    mime,
    size: item.size || item.bytes || (base64 ? Math.floor(base64.length * 0.75) : 0),
    width: item.width,
    height: item.height,
    base64: base64 || null,
    dataUrl: dataUrl || null,
    previewUrl: previewUrl || null,
    path: item.path || null,
    uri: item.uri || null,
  };
}

function pushAttachment(raw, fallbackName) {
  const norm = normalizeMedia(raw, fallbackName);
  if (!norm) {
    setStatus('Attachment empty (no image data)');
    try { ForgeHost.toast && ForgeHost.toast('No image data'); } catch (_) {}
    return false;
  }
  pendingAttachments.push(norm);
  setStatus('Attached ' + norm.name + (norm.size ? ' (' + Math.round(norm.size / 1024) + ' KB)' : ''));
  renderPending();
  return true;
}

async function takePhoto() {
  hideAttach();
  setStatus('Opening camera…');
  try {
    try { await ForgeHost.permissions.request('camera'); } catch (_) {}
    const shot = await ForgeHost.camera.takePhoto({ quality: 82, maxWidth: 1280, facing: 'back' });
    if (!shot) { setStatus('Camera returned nothing'); return; }
    pushAttachment(Object.assign({}, shot, { name: shot.name || 'photo.jpg', mime: shot.mime || 'image/jpeg' }), 'photo.jpg');
  } catch (e) {
    setStatus('Camera error: ' + (e && e.message ? e.message : e));
    try { ForgeHost.toast && ForgeHost.toast('Camera failed'); } catch (_) {}
  }
}

async function pickGallery() {
  hideAttach();
  setStatus('Opening gallery…');
  try {
    try { await ForgeHost.permissions.request('photos'); } catch (_) {}
    const gal = await ForgeHost.camera.pickPhoto({ quality: 85, maxWidth: 1280 });
    if (!gal) { setStatus('Gallery returned nothing'); return; }
    pushAttachment(Object.assign({}, gal, { name: gal.name || 'gallery.jpg', mime: gal.mime || 'image/jpeg' }), 'gallery.jpg');
  } catch (e) {
    setStatus('Gallery error: ' + (e && e.message ? e.message : e));
    try { ForgeHost.toast && ForgeHost.toast('Gallery failed'); } catch (_) {}
  }
}

async function pickFiles() {
  hideAttach();
  setStatus('Opening files…');
  try {
    const picked = await ForgeHost.files.pick({ accept: 'image/*,application/pdf,audio/*', multiple: true });
    let list = [];
    if (Array.isArray(picked)) list = picked;
    else if (picked && Array.isArray(picked.files)) list = picked.files;
    else if (picked && typeof picked === 'object' && !picked.cancelled) list = [picked];
    let n = 0;
    for (const f of list) {
      if (pushAttachment(f, f && f.name ? f.name : 'file.bin')) n++;
    }
    if (!n) setStatus('No files selected');
  } catch (e) {
    setStatus('Files error: ' + (e && e.message ? e.message : e));
  }
}

function renderPending() {
  const strip = document.getElementById('attach-strip');
  strip.innerHTML = '';
  if (!pendingAttachments.length) { strip.style.display = 'none'; return; }
  strip.style.display = 'flex';
  pendingAttachments.forEach((a, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    const src = a.previewUrl || (a.dataUrl && /^data:image\//i.test(a.dataUrl) ? a.dataUrl : '');
    if (a.type === 'image' && src) {
      chip.innerHTML = '';
      const img = document.createElement('img');
      img.alt = a.name || 'img';
      img.style.cssText = 'width:40px;height:40px;object-fit:cover;border-radius:8px;display:block';
      img.src = src;
      chip.appendChild(img);
      const x = document.createElement('span');
      x.textContent = '×';
      x.style.cursor = 'pointer';
      x.onclick = () => removeAttach(i);
      chip.appendChild(x);
    } else {
      chip.textContent = (a.name || 'file') + ' ';
      const x = document.createElement('span');
      x.textContent = '×';
      x.style.cursor = 'pointer';
      x.onclick = () => removeAttach(i);
      chip.appendChild(x);
    }
    strip.appendChild(chip);
  });
}

function removeAttach(i) { pendingAttachments.splice(i, 1); renderPending(); }

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text && !pendingAttachments.length) return;
  const userMsg = { role:'user', content:text, attachments: [...pendingAttachments] };
  messages.push(userMsg);
  renderMessages();
  input.value = '';
  const atts = [...pendingAttachments];
  pendingAttachments = [];
  renderPending();
  setStatus('Thinking…');
  try {
    const result = await runChatTurn(text, atts);
    const content = result.content || (result.kind === 'html' ? '' : '(empty reply)');
    messages.push({ role:'assistant', content: content, kind: result.kind, html: result.html });
    renderMessages();
    setStatus('Ready');
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    messages.push({ role:'assistant', content: 'Error: ' + msg });
    renderMessages();
    setStatus('Error: ' + msg);
    try { console.error('[Forge Chat] send failed', e); } catch (_) {}
  }
}

/** OpenAI/xAI wire shape for assistant tool_calls (host passes through as-is). */
function toWireToolCalls(toolCalls) {
  return (toolCalls || []).map(function (tc, i) {
    if (tc && tc.wire && tc.wire.type === 'function' && tc.wire.function) return tc.wire;
    if (tc && tc.type === 'function' && tc.function && tc.function.name) {
      return {
        id: String(tc.id || ('call_' + i)),
        type: 'function',
        function: {
          name: String(tc.function.name),
          arguments: typeof tc.function.arguments === 'string'
            ? tc.function.arguments
            : JSON.stringify(tc.function.arguments || {}),
        },
      };
    }
    const name = (tc && tc.name) || 'unknown';
    const args = (tc && tc.args != null) ? tc.args : {};
    return {
      id: String((tc && tc.id) || ('call_' + i + '_' + Date.now())),
      type: 'function',
      function: {
        name: String(name),
        arguments: typeof args === 'string' ? args : JSON.stringify(args || {}),
      },
    };
  });
}

function toolStatusLabel(name) {
  if (name === 'list_apps') return 'Loading apps…';
  if (name === 'list_activities') return 'Loading activities…';
  if (name === 'launch_app') return 'Launching app…';
  if (name === 'list_contacts') return 'Loading contacts…';
  if (name === 'find_contact') return 'Finding contact…';
  if (name === 'radio_status') return 'Reading radio status…';
  if (name === 'radio_set') return 'Updating radio…';
  if (name === 'radio_open_settings') return 'Opening settings…';
  return 'Tool: ' + name;
}

async function runChatTurn(userText, attachments) {
  let history = [{ role: 'system', content: buildSystemPrompt() }];
  messages.forEach(function (m) {
    if (m.role === 'user' || m.role === 'assistant') {
      // Skip error bubbles we injected locally
      if (m.role === 'assistant' && String(m.content || '').indexOf('Error: ') === 0 && !m.html) return;
      history.push({
        role: m.role,
        content: m.content || (m.attachments && m.attachments.length ? '[Attachment(s)]' : ''),
      });
    }
  });

  let final = '';
  let html = '';
  let kind = 'text';
  const maxR = settings.maxToolRounds || 5;
  for (let r = 0; r < maxR; r++) {
    const payload = {
      messages: history,
      providerId: settings.providerId || undefined,
      temperature: settings.temperature,
      fullResponse: true,
    };
    if (settings.enableTools) {
      payload.tools = APP_TOOLS;
      payload.tool_choice = 'auto';
      try {
        if (!window.__forgeToolsHint) {
          const hr = await ForgeHost.tools.hint({ riskMax: settings.allowDangerousTools ? 'danger' : 'confirm' });
          window.__forgeToolsHint = (hr && hr.hint) || '';
        }
      } catch (_) { window.__forgeToolsHint = ''; }
    }
    if (r === 0 && attachments.length) {
      payload.attachments = attachments.map(toChatAttachment).filter(function (a) {
        return a && (a.dataUrl || a.base64);
      });
    }

    let raw;
    try {
      raw = await ForgeHost.ai.chat(payload);
    } catch (e) {
      try { console.error('[Forge Chat] ai.chat failed round ' + r, e); } catch (_) {}
      throw e;
    }

    const norm = normalizeChatResult(raw);
    if (norm.tool_calls && norm.tool_calls.length) {
      // MUST send OpenAI-shaped tool_calls (with function.name / function.arguments)
      // or providers return 422: missing field `function`.
      history.push({
        role: 'assistant',
        content: norm.content != null && String(norm.content).length ? norm.content : null,
        tool_calls: toWireToolCalls(norm.tool_calls),
      });
      for (let ti = 0; ti < norm.tool_calls.length; ti++) {
        const tc = norm.tool_calls[ti];
        setStatus(toolStatusLabel(tc.name));
        let res;
        try {
          res = await executeTool(tc.name, tc.args);
        } catch (te) {
          res = { ok: false, error: (te && te.message) ? te.message : String(te) };
        }
        history.push({
          role: 'tool',
          tool_call_id: String(tc.id || ''),
          name: String(tc.name || ''),
          content: JSON.stringify(res),
        });
      }
      continue;
    }

    final = norm.content || '';
    const split = splitAssistantContent(final);
    kind = split.kind;
    if (kind === 'html') {
      html = split.html;
      if (settings.inlineImages) {
        try {
          const inlined = await ForgeHost.http.inlineHtml(html);
          html = inlined.html || inlined;
        } catch (e) {}
      }
    }
    break;
  }
  return { content: final, kind: kind, html: html };
}

function buildSystemPrompt() {
  let p = settings.systemPrompt || 'You are Forge Chat on Android.';
  if (settings.preferHtml) p += ' When useful, reply with <!--forge-html-->...<!--/forge-html--> fragment.';
  if (settings.enableTools) p += ' You can use list_apps, list_activities, launch_app, list_contacts, find_contact, radio_status, radio_set, radio_open_settings tools.';
  return p;
}

function normalizeChatResult(raw) {
  if (!raw) return { content: '', tool_calls: [] };
  if (typeof raw === 'string') return { content: raw, tool_calls: [] };
  let content = raw.content != null ? raw.content : (raw.text != null ? raw.text : '');
  if (content == null) content = '';
  let tcs = raw.tool_calls || raw.toolCalls || [];
  // Some hosts nest under message / choices[0].message
  if ((!tcs || !tcs.length) && raw.message && (raw.message.tool_calls || raw.message.toolCalls)) {
    tcs = raw.message.tool_calls || raw.message.toolCalls;
    if (content === '' && raw.message.content != null) content = raw.message.content;
  }
  const out = [];
  (tcs || []).forEach(function (tc, i) {
    const name = (tc.function && tc.function.name) || tc.name;
    if (!name) return;
    let args = (tc.function && tc.function.arguments != null)
      ? tc.function.arguments
      : (tc.arguments != null ? tc.arguments : {});
    if (typeof args === 'string') {
      try { args = JSON.parse(args || '{}'); } catch (_) { args = {}; }
    }
    if (!args || typeof args !== 'object' || Array.isArray(args)) args = {};
    const id = tc.id || ('call_' + i + '_' + Date.now());
    // Keep original wire object when present for faithful round-trip
    let wire = null;
    if (tc.type === 'function' && tc.function && tc.function.name) {
      wire = {
        id: String(id),
        type: 'function',
        function: {
          name: String(tc.function.name),
          arguments: typeof tc.function.arguments === 'string'
            ? tc.function.arguments
            : JSON.stringify(tc.function.arguments || args || {}),
        },
      };
    } else {
      wire = {
        id: String(id),
        type: 'function',
        function: {
          name: String(name),
          arguments: JSON.stringify(args || {}),
        },
      };
    }
    out.push({ id: String(id), name: String(name), args: args, wire: wire });
  });
  return { content: content, tool_calls: out };
}

function splitAssistantContent(c) {
  const m = String(c||'').match(/<!--forge-html-->([\s\S]*?)<!--\/forge-html-->/i);
  if (m) return {kind:'html', html:m[1].trim()};
  return {kind:'text', text:c};
}

function toChatAttachment(item) {
  const mime = item.mime || item.type || 'application/octet-stream';
  const isImg = /^image\//i.test(mime) || item.type === 'image';
  let base64 = typeof item.base64 === 'string' ? item.base64.replace(/\s+/g, '') : '';
  let dataUrl = item.rawDataUrl || item.dataUrl || item.dataURL || '';
  if (dataUrl && /^blob:/i.test(dataUrl)) dataUrl = '';
  if (!base64 && dataUrl && /base64,/i.test(dataUrl)) {
    base64 = String(dataUrl.split(/base64,/i).pop() || '').replace(/\s+/g, '');
  }
  if (!dataUrl && base64) dataUrl = 'data:' + mime + ';base64,' + base64;
  return {
    type: isImg ? 'image' : 'file',
    mime,
    name: item.name || (isImg ? 'image.jpg' : 'file.bin'),
    dataUrl: dataUrl || null,
    base64: base64 || null,
  };
}

async function executeTool(name, args) {
  args = args || {};
  const meta = TOOL_META[name] || {};
  const risk = meta.risk || 'safe';
  if (settings.confirmLaunch && (risk === 'confirm' || risk === 'danger')) {
    const preview = name + (args && Object.keys(args).length ? ' ' + JSON.stringify(args).slice(0, 180) : '');
    if (!confirm('Allow tool?\n\n' + preview)) {
      return { ok: false, cancelled: true };
    }
  }
  // Prefer host registry (auto-grows with Forge)
  if (ForgeHost.tools && ForgeHost.tools.run) {
    try {
      const riskMax = settings.allowDangerousTools ? 'danger' : 'confirm';
      const r = await ForgeHost.tools.run({ name: name, args: args, riskMax: riskMax });
      return r;
    } catch (e) {
      return { ok: false, error: (e && e.message) ? e.message : String(e) };
    }
  }
  // Legacy fallbacks
  if (name === 'list_apps') {
    const r = await ForgeHost.apps.list({ query: args.query, limit: args.limit || 40 });
    return { ok: true, apps: (r.apps || []).slice(0, 20) };
  }
  if (name === 'launch_app') {
    await ForgeHost.apps.launch(args);
    return { ok: true, launched: true };
  }
  return { ok: false, error: 'unknown tool (host tools unavailable): ' + name };
}

function openSettings() {
  const m = document.getElementById('settings-modal');
  m.style.display = 'flex';
  document.getElementById('provider-select').value = settings.providerId || '';
  document.getElementById('sys-prompt').value = settings.systemPrompt || '';
  document.getElementById('html-scale').value = settings.htmlScale;
  document.getElementById('scale-val').textContent = Math.round(settings.htmlScale*100)+'%';
  document.getElementById('inline-img').checked = settings.inlineImages;
  document.getElementById('prefer-html').checked = settings.preferHtml;
  document.getElementById('enable-tools').checked = settings.enableTools;
  document.getElementById('confirm-launch').checked = settings.confirmLaunch;
  document.getElementById('allow-danger').checked = !!settings.allowDangerousTools;
  document.getElementById('max-rounds').value = settings.maxToolRounds || 8;
}

function hideSettings() { document.getElementById('settings-modal').style.display = 'none'; }

async function saveSettings() {
  settings.providerId = document.getElementById('provider-select').value;
  settings.systemPrompt = document.getElementById('sys-prompt').value;
  settings.htmlScale = parseFloat(document.getElementById('html-scale').value);
  settings.inlineImages = document.getElementById('inline-img').checked;
  settings.preferHtml = document.getElementById('prefer-html').checked;
  settings.enableTools = document.getElementById('enable-tools').checked;
  settings.confirmLaunch = document.getElementById('confirm-launch').checked;
  settings.allowDangerousTools = document.getElementById('allow-danger').checked;
  settings.maxToolRounds = parseInt(document.getElementById('max-rounds').value);
  await ForgeHost.storage.set('forgechat_settings', settings);
  updateSubtitle();
  hideSettings();
  ForgeHost.toast('Settings saved');
}

function newChat() {
  if (messages.length && !confirm('Clear chat?')) return;
  messages = [];
  pendingAttachments = [];
  document.getElementById('attach-strip').style.display = 'none';
  renderMessages();
}

window.onload = init;
</script>
